    ContentProcedureInputArg:
      type: object
      description: One parameterized input on a procedure template.
      required:
        - name
        - description
        - type
        - default
      properties:
        name:
          type: string
          description: Argument key as referenced in commands via `#{name}`.
        description:
          type: string
        type:
          type: string
          description: Upstream type label (`path`, `url`, `string`, `integer`, …).
        default:
          type: string
          description: Default value coerced to string for a stable wire shape.

    ContentProcedureTemplate:
      type: object
      description: |
        One structured procedure template (Atomic test or custom). Platforms,
        executor, command, cleanup, and input args stay distinct — never a
        single flattened actions string (PLAN.md §3).
      required:
        - id
        - sourceId
        - version
        - externalId
        - name
        - description
        - platforms
        - executor
        - elevationRequired
        - command
        - cleanup
        - inputArgs
        - techniqueExternalIds
        - dependencyExecutorName
        - dependencies
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        version:
          type: string
          description: |
            Version token. Atomic Red Team is rolling-head and always `current`.
        externalId:
          type: string
          description: |
            Stable id within the source. Prefer upstream `auto_generated_guid`;
            otherwise `{technique}/{zero-based-index}` (documented in
            `docs/content-atomic.md`).
          examples:
            - 99747561-ed8d-47f2-9c91-1e5fde1ed6e0
        name:
          type: string
        description:
          type: string
        platforms:
          type: array
          items:
            type: string
          description: Supported platforms (`windows`, `linux`, `macos`, …).
        executor:
          type: string
          description: Executor name (`powershell`, `command_prompt`, `sh`, `bash`, `manual`, …).
        elevationRequired:
          type: boolean
        command:
          type: string
          description: Primary command or manual steps body.
        cleanup:
          type: string
          description: Cleanup command when present; empty string otherwise.
        inputArgs:
          type: array
          items:
            $ref: "#/components/schemas/ContentProcedureInputArg"
        techniqueExternalIds:
          type: array
          items:
            type: string
          description: ATT&CK technique external ids this template maps to.
        dependencyExecutorName:
          type: string
        dependencies:
          type: string
          description: |
            Serialized dependency list when present (JSON array text). Empty
            string when the upstream test has no dependencies.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ContentProcedureTemplateList:
      type: object
      required:
