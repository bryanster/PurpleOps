      description: |
        Lead, red and platform administrators. The PATCH body only accepts
        red fields — status, timestamps, command, hosts, notes — so a blue
        client cannot send fields it does not own. Optimistic locking:
        `version` is required and must match; mismatch → 409.

        Status transitions: `pending` → `running`|`skipped`|`blocked`;
        `running` → `complete`|`blocked`|`skipped`. Terminal states
        (complete/blocked/skipped) accept note/host/command edits without
        a status change. Illegal jumps → 409.

        Auto-reveal: when the status becomes `running` or `complete` and
        the engagement is blind with `auto_reveal_on_start` enabled and
        the step is unrevealed, the step is revealed in the same transaction.

        A closed engagement returns 409. The first non-pending transition
        sets `executed_by` to the caller's id if still empty.
      tags:
        - executions
      x-authz-action: execution.write_red
      x-authz-resource:
        type: execution
        engagement: engagementId
        param: executionId
      parameters:
        - $ref: "#/components/parameters/EngagementId"
        - $ref: "#/components/parameters/ExecutionId"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedExecutionPatch"
      responses:
        "200":
          description: The patched execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /engagements/{engagementId}/executions/{executionId}/detection:
    patch:
      operationId: patchBlueDetection
      summary: Write the blue (detection) side of one execution.
      description: |
        Lead, blue and platform administrators. The PATCH body only accepts
        detection fields — category, modifiers, protection, timestamps,
        source/rule ref, severity and notes — so a red client cannot send
        fields it does not own. Optimistic locking: `version` is required
        and must match; mismatch → 409.

        `detected_at` before `started_at` (when both are set) → 400.
        Unreported fields are left unchanged. Unknown modifier or category
        → 400.

        A closed engagement returns 409. `scored_by` and `scored_at` are
        set when detection category or protection changes (on any successful
        patch).

        Activity: `execution.blue_updated`.
      tags:
        - executions
      x-authz-action: execution.write_blue
      x-authz-resource:
        type: execution
        engagement: engagementId
        param: executionId
      parameters:
        - $ref: "#/components/parameters/EngagementId"
        - $ref: "#/components/parameters/ExecutionId"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlueDetectionPatch"
      responses:
        "200":
          description: The patched execution, including derived outcome and MTTD.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /executions/{executionId}/evidence:
    post:
      operationId: uploadEvidence
      summary: Upload evidence to an execution.
      description: |
        Lead, red, blue and platform administrators. Observer cannot upload.
        Domain enforces side: red seat → side=red only; blue → blue; lead →
        either; admin without seat may write either for support.

        File is streamed to a temp file and content-addressed by SHA-256:
        identical bytes uploaded twice produce one blob on disk with
        ref_count=2. MIME is validated against the configured allowlist.
        Default limits: 25 MiB per file, 2 GiB per engagement.

        Closed engagements return 409. Activity: `evidence.uploaded`.
      tags:
        - evidence
        - executions
      x-authz-action: evidence.write
      x-authz-resource:
        type: evidence
        engagement: executionId
        param: executionId
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/NewEvidenceRequest"
      responses:
        "201":
          description: Evidence metadata for the uploaded file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listEvidenceByExecution
      summary: List evidence for an execution.
      description: |
        Any engagement member who can read the execution. Evidence on
        unrevealed steps in blind mode is concealed (same rule as
        execution.read). Newest first.
      tags:
        - evidence
        - executions
      x-authz-action: execution.read
      x-authz-resource:
        type: execution
        engagement: executionId
        param: executionId
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
      responses:
        "200":
          description: A list of evidence metadata rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evidence"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /evidence/{evidenceId}:
    get:
      operationId: getEvidence
      summary: Read evidence metadata.
      description: |
        Any engagement member who can read the owning execution. In blind
        mode, evidence on an unrevealed step is 404-concealed.
      tags:
        - evidence
      x-authz-action: evidence.read
      x-authz-resource:
        type: evidence
        engagement: evidenceId
        param: evidenceId
      parameters:
        - $ref: "#/components/parameters/EvidenceId"
      responses:
        "200":
          description: Evidence metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteEvidence
      summary: Delete evidence.
      description: |
        Uploader, lead or platform administrator. Decrements the blob
        refcount; if it reaches zero the blob file is removed from disk.

        Closed engagements still allow delete (cleanup), unlike uploads.
        Activity: `evidence.deleted`.
      tags:
        - evidence
      x-authz-action: evidence.write
      x-authz-resource:
        type: evidence
        engagement: evidenceId
        param: evidenceId
      parameters:
        - $ref: "#/components/parameters/EvidenceId"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Evidence deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /evidence/{evidenceId}/content:
    get:
      operationId: getEvidenceContent
      summary: Download evidence file content.
      description: |
        Any engagement member who can read the owning execution. Content-Type
        is the stored MIME from upload (allowlisted). Content-Disposition:
        attachment with filename. X-Content-Type-Options: nosniff.
      tags:
        - evidence
      x-authz-action: evidence.read
      x-authz-resource:
        type: evidence
        engagement: evidenceId
        param: evidenceId
      parameters:
        - $ref: "#/components/parameters/EvidenceId"
      responses:
        "200":
          description: The evidence file content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /content/sources:
    get:
      operationId: listContentSources
      summary: List content sources.
      description: |
        Any authenticated subject. The shared library is what an engagement is
        planned from, so reading the registry is not an administrative act.

        Filter by `kind` and/or `enabled`. Disabled sources stay in the list —
        an administrator needs to see them to turn them back on — and library
        browse endpoints (later tickets) are what omit their objects by default.
      tags:
        - content
      x-authz-action: content.read
      x-authz-resource:
        type: content
      parameters:
        - $ref: "#/components/parameters/ContentSourceKindFilter"
        - $ref: "#/components/parameters/ContentSourceEnabledFilter"
      responses:
        "200":
          description: Every matching source, kind then id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentSourceList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /content/sources/{sourceId}:
    get:
      operationId: getContentSource
      summary: Read one content source.
      description: |
        Any authenticated subject. Carries license/attribution and a summary of
        the most recent sync job, when one exists.
      tags:
        - content
      x-authz-action: content.read
      x-authz-resource:
        type: content
      parameters:
        - $ref: "#/components/parameters/ContentSourceId"
      responses:
        "200":
          description: The source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentSourceDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateContentSource
      summary: Edit a content source's name, URL or ref.
      description: |
        Administrators only (`content.manage`). A patch: a field that is absent
        is left alone. `kind` is not a field of this request — kinds are a
        closed set seeded by migration, and there is no way to ask to change
        one.

        Builtin upstream seeds may have their mirror URL or ref retargeted so a
        deployment can point at an internal cache. The custom source accepts a
        rename the same way.
      tags:
        - content
      x-authz-action: content.manage
      x-authz-resource:
        type: content
      parameters:
        - $ref: "#/components/parameters/ContentSourceId"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContentSourceRequest"
      responses:
        "200":
          description: The source as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentSource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteContentSource
      summary: Hard-delete a content source and its content subtree.
      description: |
        Administrators only (`content.manage`). Removes the source and every
        version, object, and job row that names it, in one write transaction.
        There is no path from content into app, so engagement history is never
        touched.

        The **custom** seed source cannot be deleted (`409`): user-authored rows
        need a home. Builtin upstream seeds may be deleted; disabling is the
        normal path, and re-seed is not automatic.

        When a later milestone adds engagement-side references, a source that
        is still referenced will answer `409` with counts rather than cascade
        into war-room data. In M2 those refs do not exist, so a non-custom
        source always deletes.
      tags:
        - content
      x-authz-action: content.manage
      x-authz-resource:
        type: content
      parameters:
        - $ref: "#/components/parameters/ContentSourceId"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: The source and its content subtree are gone.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /content/sources/{sourceId}/enable:
    post:
      operationId: enableContentSource
      summary: Enable a content source.
      description: |
        Administrators only (`content.manage`). Sets `enabled=true`. Idempotent.

        Enabling makes the source's objects eligible for library browse and for
        new engagement-side references again.
      tags:
        - content
      x-authz-action: content.manage
      x-authz-resource:
        type: content
      parameters:
        - $ref: "#/components/parameters/ContentSourceId"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: The source, now enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentSource"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /content/sources/{sourceId}/disable:
    post:
      operationId: disableContentSource
      summary: Disable a content source.
      description: |
        Administrators only (`content.manage`). Sets `enabled=false`. Idempotent.

        Rows stay on disk. Library browse/search/pickers (later tickets) omit
        objects from disabled sources by default, and APIs that would create a
        *new* reference answer `409`. Existing engagement data is not modified.
      tags:
        - content
      x-authz-action: content.manage
      x-authz-resource:
        type: content
      parameters:
        - $ref: "#/components/parameters/ContentSourceId"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: The source, now disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentSource"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /content/sources/{sourceId}/versions:
    get:
      operationId: listContentSourceVersions
      summary: List version snapshots under a content source.
      description: |
        Any authenticated subject. ATT&CK carries many versions; rolling sources
        (Atomic, Sigma, CTID, custom) carry at most the single `current` token.
      tags:
        - content
      x-authz-action: content.read
      x-authz-resource:
        type: content
      parameters:
        - $ref: "#/components/parameters/ContentSourceId"
      responses:
        "200":
          description: Every version under the source, version then id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentSourceVersionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /content/sources/{sourceId}/sync:
    post:
      operationId: startContentSourceSync
      summary: Enqueue a content sync job for a source.
      description: |
        Administrators only (`content.sync`). Enqueues one installation-wide
        content job. A second start while any job is `queued`, `running`, or
        `cancelling` answers `409` and names the active `jobId` in `detail`.

        The optional body pin `{ "version": "15.1" }` selects a known ATT&CK
        release. Omit it to mean "latest discoverable" per the adapter. Rolling
        sources (Atomic, Sigma, CTID) always write the `current` version token
        and ignore a pin.

        The custom seed source cannot be synced from upstream (`409`).
      tags:
        - content
      x-authz-action: content.sync
      x-authz-resource:
        type: content
      parameters:
        - $ref: "#/components/parameters/ContentSourceId"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartContentSyncRequest"
      responses:
        "202":
          description: The job was enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentSyncJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /content/sources/{sourceId}/bundle:
    post:
      operationId: uploadContentSourceBundle
      summary: Upload an offline content bundle for a source.
      description: |
        Administrators only (`content.sync`). Accepts a multipart release archive
        (zip / tar.gz) whose bytes match what the adapter's HTTPS fetch would
        have produced. Creates a `bundle_import` job and runs Parse → Normalize
        → Apply with no network Fetch. The upload is spooled under the content
        data directory; archives larger than `BLACKLIGHT_CONTENT_MAX_BYTES`
        are refused before a job is enqueued, with the limit named in the
        problem detail.

        Takes the same global job slot as online sync (`409` when another job
        is active). Progress streams over `GET /events` exactly like sync.

        See `docs/content-bundles.md` for per-kind archive layout and how to
        obtain a bundle on a connected machine.
      tags:
        - content
      x-authz-action: content.sync
      x-authz-resource:
        type: content
      parameters:
        - $ref: "#/components/parameters/ContentSourceId"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadContentBundleRequest"
      responses:
        "202":
          description: The bundle_import job was enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentSyncJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /content/sources/{sourceId}/reprocess:
    post:
      operationId: reprocessContentSource
      summary: Reprocess a source from its last raw snapshot.
      description: |
        Administrators only (`content.sync`). Creates a `reprocess` job that
        opens the last successful raw snapshot for the named version and runs
        Parse → Normalize → Apply with no network Fetch. Use this after an
        adapter bugfix to repair the catalog without another download.

        The optional body pin `{ "version": "15.1" }` selects which snapshot.
        Rolling sources (Atomic, Sigma, CTID) default to `current` when the
        pin is omitted. ATT&CK requires an explicit version. Answers `409`
        when no raw snapshot exists for that source/version, and when another
        content job already holds the global slot.
      tags:
        - content
      x-authz-action: content.sync
      x-authz-resource:
        type: content
      parameters:
        - $ref: "#/components/parameters/ContentSourceId"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReprocessContentSourceRequest"
      responses:
        "202":
          description: The reprocess job was enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentSyncJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"


  /content/jobs:
    get:
      operationId: listContentJobs
      summary: List content sync jobs.
      description: |
        Administrators only (`content.sync`). Returns jobs newest first. Filter
        by `status` and/or `sourceId`. Job list is admin-only in M2 — members
        read progress via source detail's `lastJob` summary (`content.read`).
      tags:
        - content
      x-authz-action: content.sync
      x-authz-resource:
        type: content
      parameters:
        - $ref: "#/components/parameters/ContentJobStatusFilter"
        - $ref: "#/components/parameters/ContentJobSourceIdFilter"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Matching jobs, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentSyncJobList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /content/jobs/{jobId}:
    get:
      operationId: getContentJob
      summary: Read one content sync job.
      description: |
        Any authenticated subject (`content.read`). Job progress is not secret
        relative to the shared library the job is writing.
      tags:
        - content
      x-authz-action: content.read
      x-authz-resource:
        type: content
      parameters:
        - $ref: "#/components/parameters/ContentJobId"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentSyncJob"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /content/jobs/{jobId}/cancel:
    post:
      operationId: cancelContentJob
      summary: Cancel a content sync job.
      description: |
        Administrators only (`content.sync`). A `queued` job becomes
        `cancelled` immediately. A `running` job enters `cancelling`; adapter
        steps observe context cancel and the job ends `cancelled`. Terminal
        jobs answer `409`.
      tags:
        - content
      x-authz-action: content.sync
      x-authz-resource:
        type: content
      parameters:
        - $ref: "#/components/parameters/ContentJobId"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: The job after the cancel request was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentSyncJob"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /content/techniques:
    get:
      operationId: listContentTechniques
      summary: List ATT&CK techniques.
      description: |
        Any authenticated subject (`content.read`). Returns techniques from
        **enabled** sources only. Filter by ATT&CK `version`, substring `q`
        (external id / name / description, case-insensitive), parent `tactic`
        external id, and `isSubtechnique`.
      tags:
        - content
      x-authz-action: content.read
      x-authz-resource:
        type: content
      parameters:
        - $ref: "#/components/parameters/ContentVersionFilter"
