# Blacklight HTTP API — the source of truth for both sides of the wire.
#
# The Go server interface (internal/httpapi/gen) and the TypeScript client
# (web/src/api, M0B-009) are both generated from this file. Hand-writing a
# handler signature or a fetch call that is not described here is a review
# rejection: edit this file, run `make generate`, then implement the method the
# generator produced.
#
# The conventions this file follows are enforced by api/conventions_test.go,
# which runs in `make lint` as well as `make test`. A breach fails the build
# naming the rule it broke, rather than surfacing as a review comment later.
openapi: 3.1.0

info:
  title: Blacklight API
  summary: Purple-team assessments — engagements, scenarios, executions, detections and reports.
  description: |
    The HTTP API of a Blacklight deployment. Single-tenant, single-node: this
    document describes the one server the SPA talks to, and the same endpoints
    are the supported integration surface for scripts and CI.

    All timestamps are UTC, RFC 3339. All identifiers are UUIDv7 strings —
    sortable by creation time, so `ORDER BY id` is a stable tiebreaker.
    Errors are RFC 9457 problem documents; see the `Problem` schema.
  # The revision of this document, not of the running binary — `GET /version`
  # reports the binary. Bump the minor for additive changes, the major for
  # breaking ones (which also means a new `/api/vN` prefix, so a breaking bump
  # should be rare enough to argue about first).
  version: 1.0.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  # Relative on purpose: the SPA is served from this same origin (M0B-010) and
  # there is no CORS, so an absolute URL here would only ever be wrong.
  - url: /api/v1
    description: This deployment.

# Authenticated by default. An operation that is genuinely public overrides this
# with `security: []` and says why in its description — so forgetting to think
# about auth fails closed rather than open, which is the failure mode PLAN.md §4
# is written against.
#
# Note: the kin-openapi request validator refuses to serve any operation that
# carries a security requirement unless it is given an AuthenticationFunc
# (openapi3filter.ErrAuthenticationServiceMissing). M1-003 supplies one, and it
# deliberately answers "yes" to everything — authentication is the middleware's
# job and authorization is M1-013's, and a validator that rejected an anonymous
# request could not serve the 401 problem document this API promises.
security:
  - cookieSession: []
  - bearerServiceToken: []

tags:
  - name: system
    description: Liveness and build identity. No authentication, no state.
  - name: auth
    description: Sessions, MFA, single sign-on and service tokens (M1).
  - name: users
    description: Administration of platform users and their roles (M1).
  - name: content
    description: Installable reference content — ATT&CK, Atomic Red Team, Sigma, CTID (M2).
  - name: engagements
    description: Engagements, their members and their retest rounds (M3).
  - name: scenarios
    description: Scenarios and the steps that make up an attack chain (M3).
  - name: executions
    description: One step run in one round — red execution, blue detection, evidence (M3).
  - name: collaboration
    description: Comments, activity, presence and the live event stream (M4).
  - name: analytics
    description: Rollups, coverage, detection timing and round-over-round deltas (M5).
  - name: reports
    description: Report building, rendering and sharing (M6).

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Report whether the server and its dependencies are healthy.
      description: |
        Public by design: an orchestrator or uptime monitor has to be able to call
        this without credentials, and a health check that needs a session reports
        "unhealthy" whenever authentication itself breaks.

        Returns 200 when every check is `ok`, and 503 when any check is `error`.
        The body is the same shape either way — the caller reads `checks` to find
        out *what* is wrong — so the 503 is a health report, not a problem
        document.
      tags:
        - system
      security: []
      responses:
        "200":
          description: Every dependency is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: At least one dependency is unhealthy; `checks` says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          $ref: "#/components/responses/InternalError"

  /version:
    get:
      operationId: getVersion
      summary: Return the build identity of the running binary.
      description: |
        Public: the SPA shows it in the footer and on the login page, and support
        requests are unanswerable without it. It reveals a version and a commit
        of software whose source is public anyway.
      tags:
        - system
      security: []
      responses:
        "200":
          description: The build identity of this binary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      operationId: login
      summary: Sign in with an email address and password.
      description: |
        Public, because the caller has no session yet — that is what this
        endpoint issues.

        Every way of failing produces the *same* 401 with the same body: a wrong
        password, an address nobody holds, and a disabled account are
        indistinguishable, so that this endpoint cannot be used to find out who
        has an account here. The server spends the same work on each, too.

        A 200 does not always mean a session. When a second factor is required,
        `status` is `mfa_required`, no *session* cookie is set, and the caller
        must post a code to `POST /auth/mfa/totp/verify` before anything is
        signed in (M1-006). Read `status` rather than assuming.

        Attempts are throttled per account and per client address (M1-004). Once
        either limit trips, every attempt is a 429 with a `Retry-After` — the
        right password included, because a lockout that the right password ends
        is not a lockout. The 429 is identical for an account that exists and one
        that does not.
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: |
            The credentials were correct. `status` says whether that was enough:
            `authenticated` means the session cookie in `Set-Cookie` is live,
            `mfa_required` means it is not.
          headers:
            Set-Cookie:
              description: |
                When `status` is `authenticated`: the session cookie, `HttpOnly`,
                `SameSite=Strict`, `Path=/`, and `Secure` on every deployment
                that is not `BLACKLIGHT_ENV=development`. A second `Set-Cookie`
                carries `bl_csrf` (M1-005), with the same attributes except
                that it is **not** `HttpOnly` — script has to read it to send
                `X-CSRF-Token`.

                When `status` is `mfa_required`: the short-lived `bl_mfa`
                cookie instead, and no session cookie. It authorizes nothing but
                `POST /auth/mfa/totp/verify`; see the `mfaChallenge` scheme.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/logout:
    post:
      operationId: logout
      summary: End the current session.
      description: |
        Revokes the session server-side and clears the cookie. A replay of the
        old cookie afterwards is a 401 — the session is ended in the database,
        not merely forgotten by the browser.

        A request that carries no usable session is a 204 as well: the caller
        wanted to be signed out, and they are.
      tags:
        - auth
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: The session is revoked and the cookie cleared.
          headers:
            Set-Cookie:
              description: |
                The expired session cookie, which clears the browser's copy. The
                `bl_csrf` cookie is cleared alongside it, in a second
                `Set-Cookie` — the two are issued together and dropped together.
              required: true
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Return the signed-in user, their platform role and their engagement memberships.
      description: |
        Everything the interface needs to decide what to show: who you are, what
        you may do to this installation, which engagements you are in and with
        which role, and whether this session has satisfied MFA.

        It never returns anything about the session token. What is in the cookie
        stays in the cookie.
      tags:
        - auth
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/password:
    post:
      operationId: changePassword
      summary: Change your own password.
      description: |
        Requires the current password, so that a borrowed browser cannot be used
        to take an account over.

        On success the current session is rotated — a new token for the same
        session, in a new cookie — and every *other* session belonging to this
        user is revoked. Changing your password signs out the places you did not
        change it from.
      tags:
        - auth
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: The password was changed, this session rotated, and every other one revoked.
          headers:
            Set-Cookie:
              description: |
                The rotated session cookie. The token it replaces stops working,
                and the matching `bl_csrf` cookie is set in a second
                `Set-Cookie`: the CSRF token is derived from the session token,
                so it rotates with it.
              required: true
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/mfa/totp/enroll:
    post:
      operationId: enrollTotp
      summary: Start enrolling an authenticator app.
      description: |
        Mints a fresh shared secret and returns it three ways: as an
        `otpauth://` URI, as a QR code to point a camera at, and as the base32
        string to type in when the camera will not focus.

        The secret is **unconfirmed** until `POST /auth/mfa/totp/confirm`
        succeeds. An unconfirmed secret gates nothing — a browser closed between
        this call and that one leaves the account exactly as it was, which is
        what stops a half-finished enrolment locking somebody out.

        Calling this again replaces an unconfirmed secret, so a re-scan works.
        It refuses with `409` when a *confirmed* authenticator already exists:
        replacing one is `DELETE /auth/mfa/totp` followed by this, and that
        needs the current password.

        This is the only response that ever carries the secret.
      tags:
        - auth
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: A new, unconfirmed secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPEnrolment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/mfa/totp/confirm:
    post:
      operationId: confirmTotp
      summary: Confirm an enrolment by presenting a code from it.
      description: |
        Proves the authenticator was actually set up. On success the enrolment
        becomes the second factor this account is asked for at sign-in, this
        session is marked as having satisfied MFA, and it is rotated onto a new
        token — satisfying a factor is a privilege change, and PLAN.md §4 wants
        the token to change whenever that is true.

        A wrong code is a `400` naming the `code` field, not a `401`: the caller
        is signed in and this is a form to correct, not a session to re-establish.
        It is deliberately not throttled — the only secret being guessed is the
        caller's own, and getting it right grants them nothing they did not
        already have.
      tags:
        - auth
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "204":
          description: The enrolment is confirmed and this session rotated.
          headers:
            Set-Cookie:
              description: |
                The rotated session cookie, with its matching `bl_csrf` cookie
                in a second `Set-Cookie`.
              required: true
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/mfa/totp/verify:
    post:
      operationId: verifyTotp
      summary: Complete a sign-in by presenting a code from your authenticator.
      description: |
        The second half of a sign-in that answered `mfa_required`. It carries no
        session — that is the point: the credential is the short-lived
        `bl_mfa` cookie set by `POST /auth/login`, which authorizes nothing
        except this endpoint and expires in minutes.

        On success the pending state is spent, a session is issued with MFA
        satisfied, and the `bl_mfa` cookie is cleared. One correct code buys
        exactly one session.

        Every way of failing is the same `401`: a wrong code, a code already
        used, an expired pending state, and no pending state at all. Attempts
        are throttled per account and per client address alongside password
        attempts (M1-004), and the `429` is identical whichever limit closed.
      tags:
        - auth
      security:
        - mfaChallenge: []
      responses:
        "200":
          description: |
            The code was correct. `status` is always `authenticated` — there is
            no third factor to ask for.
          headers:
            Set-Cookie:
              description: |
                The session cookie, its `bl_csrf` companion, and the cleared
                `bl_mfa` cookie, in three `Set-Cookie` headers.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"

  /auth/mfa/totp:
    delete:
      operationId: disableTotp
      summary: Remove your authenticator.
      description: |
        Requires the current password, for the same reason changing a password
        does: a session left open on a shared machine must not be enough to take
        the second factor off an account.

        Refused with `403` when an administrator requires MFA of this person
        (M1-008) — removing the factor would leave an account that cannot
        satisfy a requirement it is still subject to.
      tags:
        - auth
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisableTOTPRequest"
      responses:
        "204":
          description: The authenticator is removed. Removing one that was not there answers the same way.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: bl_session
      description: |
        Browser session cookie issued by `POST /auth/login` (M1-003): `HttpOnly`,
        `Secure`, `SameSite=Strict`.

        State-changing requests additionally carry a double-submit CSRF token in
        `X-CSRF-Token` (M1-005). OpenAPI cannot express "this scheme also needs
        that header", so the header is declared as a parameter on the operations
        that require it — see `CSRFToken` for why it is nevertheless declared
        optional, and what happens when it is missing.
    mfaChallenge:
      type: apiKey
      in: cookie
      name: bl_mfa
      description: |
        The pending-state cookie set by `POST /auth/login` when a second factor
        is required (M1-006): `HttpOnly`, `Secure`, `SameSite=Strict`, and gone
        within minutes.

        It is emphatically not a session. Nothing resolves one of these into a
        caller — a request carrying only this cookie is anonymous everywhere
        except `POST /auth/mfa/totp/verify`, and `GET /auth/me` answers it with
        a `401`. It is spent by the first code accepted against it.
    bearerServiceToken:
      type: http
      scheme: bearer
      bearerFormat: bl_<prefix>_<secret>
      description: |
        Scoped, expiring service token (M1-011), sent as
        `Authorization: Bearer bl_<prefix>_<secret>`. Shown once at creation and
        stored only as a hash. A token can never exceed the live permissions of
        the user who owns it.

  parameters:
    # Referenced by every state-changing operation that a browser session may
    # reach, so that the requirement is in the document a client is generated
    # from rather than only in the server's middleware.
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: |
        The double-submit CSRF token (M1-005): the value of the non-`HttpOnly`
        `bl_csrf` cookie, echoed back in this header.

        **Required in practice** on every state-changing request authenticated
        by the session cookie, even though it is declared optional here. The
        rule belongs to one middleware, which answers a missing or wrong token
        with `403` and `code: "forbidden"`; declaring the parameter required
        would make an *absent* header a `400` from the request validator and a
        *wrong* one a `403`, splitting one rule across two layers and two status
        codes for no gain to the caller.

        A request authenticated by a service token does not send this and is not
        subject to the check — CSRF is a property of cookies, which browsers
        attach on their own.
      schema:
        type: string

    # The two halves of the pagination convention. Every collection endpoint
    # references these rather than declaring its own, so `limit` means the same
    # thing everywhere and the generated clients share one page shape:
    # `{items: [...], nextCursor: string|null}`.
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque cursor taken verbatim from the `nextCursor` of a previous
        response. Absent means "from the beginning". Its contents are an
        implementation detail — clients must not parse or construct one.
      schema:
        type: string
        minLength: 1

  responses:
    # One reusable response per problem code, so an operation cannot invent its
    # own error shape and the code/status pairing stays 1:1 with the table in
    # internal/httpapi/apierr (M0B-007).
    BadRequest:
      description: The request does not match this specification. `code` is `validation_failed`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: |
        No usable session — absent, expired, idle for too long, revoked, or the
        credentials just presented were wrong. `code` is `unauthenticated`.

        The client's move is to sign in. Compare `forbidden`, which means the
        caller is known and still may not do this.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated, but not permitted to do this. `code` is `forbidden`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: |
        No such resource — or one the caller may not know exists, which is
        reported the same way on purpose. `code` is `not_found`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MethodNotAllowed:
      description: |
        The path exists but not with this method. `code` is `method_not_allowed`.

        No operation references this response, and none can: a 405 is decided
        before a request matches an operation, by the request validator that
        looked the path up in this document (M0B-006). It is declared here
        anyway so that every problem code has a response describing its shape —
        the pairing TestEveryProblemCodeHasASharedResponse checks.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request contradicts the current state of the resource. `code` is `conflict`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: |
        Rate limited. `code` is `rate_limited`.

        `Retry-After` says how many seconds to wait, and is always present.
        Retrying before it elapses does not shorten it.
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: |
        Something failed that the caller cannot act on. `code` is `internal` and
        `detail` is deliberately generic — the cause is in the server log under
        the request ID echoed in `instance`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: |
        RFC 9457 problem detail — the only error shape this API produces, served
        as `application/problem+json` (M0B-007).

        Clients switch on `code`. `title` and `detail` are prose for a human and
        may be reworded at any time.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri-reference
          description: |
            URI reference identifying the problem type. `about:blank` when the
            status code says everything there is to say.
          examples:
            - about:blank
        title:
          type: string
          description: Short human-readable summary of the problem type. Stable for a given `type`.
          examples:
            - Not Found
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: The HTTP status code, repeated so a logged or forwarded body stands alone.
          examples:
            - 404
        detail:
          type: string
          description: |
            Explanation specific to this occurrence. Never carries internal
            detail: an unrecognised server-side error is reported generically and
            the real error goes to the log.
        instance:
          type: string
          description: |
            The request ID, echoed as `X-Request-Id`. A user quotes it in a bug
            report and an operator greps for it.

            RFC 9457 types this as a URI reference; a bare request ID is a
            relative reference, and it is far more useful to a support desk than
            a URI that resolves to nothing.
          examples:
            - 018f3b2c-7a41-7c3e-9b0d-2f1a4c6e8d90
        code:
          $ref: "#/components/schemas/ProblemCode"
        errors:
          type: array
          description: Field-level failures. Present when `code` is `validation_failed`.
          items:
            $ref: "#/components/schemas/FieldError"

    ProblemCode:
      type: string
      description: |
        Stable machine-readable error identifier. Clients switch on this, never on
        `detail` and never on the status alone.

        Each code maps to exactly one HTTP status; the mapping lives in
        internal/httpapi/apierr and a test there asserts it (M0B-007). Adding a
        code means adding it in both places in the same change.
      enum:
        - validation_failed
        - unauthenticated
        - forbidden
        - not_found
        - method_not_allowed
        - conflict
        - rate_limited
        - internal

    FieldError:
      type: object
      description: One field-level validation failure.
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Path of the offending field within the request body.
          examples:
            - members[0].role
        message:
          type: string
          description: What is wrong with it, in English.
          examples:
            - must be one of lead, red, blue, observer

    Health:
      type: object
      description: |
        Health of the server and of everything it depends on. Reported with a 200
        when `status` is `ok` and a 503 when it is `error`, so a monitor that only
        looks at the status code still gets the right answer.
      required:
        - status
        - checks
      properties:
        status:
          $ref: "#/components/schemas/HealthState"
        checks:
          $ref: "#/components/schemas/HealthChecks"

    HealthChecks:
      type: object
      description: |
        One entry per dependency. Adding a dependency means adding its check
        here — a check that exists in code but not in this schema is invisible to
        every client.
      required:
        - db
      properties:
        db:
          $ref: "#/components/schemas/HealthState"

    HealthState:
      type: string
      description: Outcome of a single health check, or of the report as a whole.
      enum:
        - ok
        - error

    Version:
      type: object
      description: |
        Build identity of the running binary, stamped at link time. Every field is
        populated: an unstamped build reports a placeholder rather than an empty
        string.
      required:
        - version
        - commit
        - buildDate
      properties:
        version:
          type: string
          description: Release identifier from `git describe`, or `dev` for an unstamped build.
          examples:
            - v2.1.0-3-gabc1234
        commit:
          type: string
          description: Git commit the binary was built from, or `unknown`.
          examples:
            - a1b2c3d4e5f6
        buildDate:
          type: string
          description: |
            UTC build timestamp, RFC 3339 — or the literal `unknown` for a build
            without version stamping. Deliberately not `format: date-time`,
            because it is not always a timestamp and a client must not assume it
            parses.
          examples:
            - 2026-02-01T12:00:00Z

    LoginRequest:
      type: object
      description: Credentials for `POST /auth/login`.
      required:
        - email
        - password
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 320
          description: |
            The address the account was created with, matched without regard to
            case or surrounding whitespace.
          examples:
            - alice@example.com
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: |
            The password, as typed. The bounds here are a backstop on an
            unauthenticated path, not the policy: the policy lives in one place
            (internal/authn/password) and applies where a password is *set*.
            Holding a login attempt to it would tell an attacker how long the
            password is not.

    LoginStatus:
      type: string
      description: |
        What a successful `POST /auth/login` established. A client must branch on
        this rather than assume that 200 means signed in.
      enum:
        # Credentials accepted and a session issued; the cookie is set.
        - authenticated
        # Credentials accepted, but a second factor is required and has not been
        # presented. No session, no cookie (M1-006 through M1-008).
        - mfa_required

    LoginResult:
      type: object
      description: The outcome of a successful `POST /auth/login`.
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/LoginStatus"
        user:
          $ref: "#/components/schemas/CurrentUser"
          description: |
            The signed-in user. Present when `status` is `authenticated` and
            absent otherwise — a caller awaiting a second factor has not been
            told who they are yet.

    CurrentUser:
      type: object
      description: |
        The caller, as `GET /auth/me` reports them. It carries nothing about the
        session token: the cookie is the only place that value exists outside the
        client.
      required:
        - id
        - email
        - displayName
        - platformRole
        - mfa
        - memberships
      properties:
        id:
          type: string
          description: The user's identifier — a UUIDv7, as every identifier here is.
        email:
          type: string
          description: The address as it was typed when the account was created.
        displayName:
          type: string
          description: The name to show for this person.
        platformRole:
          $ref: "#/components/schemas/PlatformRole"
        mfa:
          $ref: "#/components/schemas/MFAState"
        memberships:
          type: array
          description: |
            Every engagement this person belongs to, and their role in it. An
            administrator's list is still only what they are a *member* of —
            their reach beyond it comes from `platformRole`, not from here.
          items:
            $ref: "#/components/schemas/EngagementMembership"
        csrfToken:
          type: string
          description: |
            The double-submit CSRF token for this session (M1-005) — the same
            value as the `bl_csrf` cookie, which is where a browser client
            should read it from.

            It is here for a client that has no cookie jar to read, and it is
            not a secret in the way the session token is: it authorizes nothing
            on its own. Absent for a caller authenticated by a service token,
            which is not subject to the check.

    PlatformRole:
      type: string
      description: |
        What somebody may do to this installation: `admin` manages users, content
        and every engagement; `member` takes part in the engagements they belong
        to. What they may do *inside* one is `EngagementRole`, and the two are
        deliberately not the same vocabulary.
      enum:
        - admin
        - member

    EngagementRole:
      type: string
      description: |
        What somebody may do inside one engagement. Red and blue are separate so
        that blind mode and the split write endpoints have something to decide
        on.
      enum:
        - lead
        - red
        - blue
        - observer

    EngagementMembership:
      type: object
      description: One person's place in one engagement.
      required:
        - engagementId
        - role
        - addedAt
      properties:
        engagementId:
          type: string
        role:
          $ref: "#/components/schemas/EngagementRole"
        addedAt:
          type: string
          format: date-time

    MFAState:
      type: object
      description: |
        Where this person and this session stand on multi-factor authentication.
        Whether an administrator *requires* it and whether this session has
        *satisfied* it are separate facts — conflating them is the hole M1-008
        closes.
      required:
        - enforced
        - enrolled
        - satisfied
      properties:
        enforced:
          type: boolean
          description: An administrator requires a second factor of this person.
        enrolled:
          type: boolean
          description: |
            This person has a confirmed authenticator (M1-006). A *started* but
            unconfirmed enrolment does not count — it gates nothing, so
            reporting it as enrolled would be a lie the interface acted on.

            Separate from `enforced` for the same reason `satisfied` is:
            "required to" and "has" are different facts, and treating one as
            evidence of the other is the hole M1-008 closes.
        satisfied:
          type: boolean
          description: A second factor was presented for *this* session.

    ChangePasswordRequest:
      type: object
      description: |
        Body of `POST /auth/password`. The current password is required even
        though the caller is signed in: a session left open on a shared machine
        must not be enough to take the account over.
      required:
        - currentPassword
        - newPassword
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: |
            The replacement. The policy — at least 12 characters, at most 128,
            and not one of the passwords attackers try first — is applied by the
            server and reported as field errors on `newPassword`, so that there
            is one definition of an acceptable password rather than one here and
            one in the client.

    TOTPEnrolment:
      type: object
      description: |
        A newly minted, unconfirmed authenticator secret, in the three forms a
        person might need to get it into an app. Every field carries the same
        secret; this is the only response in the API that does.
      required:
        - otpauthUri
        - secret
        - qrCode
      properties:
        otpauthUri:
          type: string
          description: |
            The `otpauth://totp/...` URI, for a client that can hand a URI to an
            authenticator directly.
          examples:
            - otpauth://totp/Blacklight%20%28blacklight.internal%29:alice@example.com?algorithm=SHA1&digits=6&issuer=Blacklight+%28blacklight.internal%29&period=30&secret=JBSWY3DPEHPK3PXP
        secret:
          type: string
          description: |
            The base32 shared secret, for typing in by hand. It is the same
            value that is inside `otpauthUri`, spelled out so a client does not
            have to parse one to show the other.
          examples:
            - JBSWY3DPEHPK3PXP
        qrCode:
          type: string
          description: |
            The URI rendered as a PNG in a `data:` URI, ready to be the `src` of
            an `<img>`. A data URI rather than SVG markup so that showing it
            does not mean putting server-supplied markup into the page; the
            content security policy already allows `img-src data:`.
          examples:
            - data:image/png;base64,iVBORw0KGgoAAAANSUhEUg…

    TOTPCodeRequest:
      type: object
      description: |
        A six-digit code from an authenticator app. The same body confirms an
        enrolment and completes a sign-in.
      required:
        - code
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
          description: |
            The code as the app shows it, without the space some apps put in the
            middle. Six digits is the whole vocabulary — a value that is not six
            digits is rejected as malformed rather than counted as a guess.
          examples:
            - "492817"

    DisableTOTPRequest:
      type: object
      description: |
        Body of `DELETE /auth/mfa/totp`. The current password is required for the
        same reason `ChangePasswordRequest` asks for it.
      required:
        - currentPassword
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
