      type: object
      description: Every field is optional; only the ones present are changed.
        Soft freeze prevents changes to identity fields after the step's
        execution leaves pending.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        objective:
          type: string
          maxLength: 4096
        targetAsset:
          type: string
          maxLength: 255
        tools:
          type: array
          items:
            type: string
        controlsInScope:
          type: array
          items:
            type: string

    ReorderSteps:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
          description: Ordered list of step ids. Every step in the scenario
            must appear exactly once. Ordinals are reassigned 1..N to match this order.

    ExecutionStatus:
      type: string
      description: The red-side state of one execution.
      enum:
        - pending
        - running
        - complete
        - blocked
        - skipped

    Execution:
      type: object
      required:
        - id
        - stepId
        - version
        - status
        - executedBy
        - commandRun
        - sourceHost
        - targetHost
        - redNotes
        - detectionModifiers
        - detectingSource
        - detectingRuleRef
        - alertSeverity
        - blueNotes
        - scoredBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7.
        stepId:
          type: string
          format: uuid
        version:
          type: integer
          description: Optimistic-lock version. Incremented on every red or blue PATCH.
        status:
          $ref: "#/components/schemas/ExecutionStatus"
        executedBy:
          type: string
          description: User id of the first red operator who moved this out of pending.
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        commandRun:
          type: string
          maxLength: 4096
          description: The command or payload that was executed.
        sourceHost:
          type: string
          maxLength: 255
          description: The host that ran the attack.
        targetHost:
          type: string
          maxLength: 255
          description: The host that received the attack.
        redNotes:
          type: string
          maxLength: 4096
          description: Free-form notes from the red operator.
        detectionCategory:
          type: [string, "null"]
          enum:
            - none
            - telemetry
            - general
            - tactic
            - technique
        detectionModifiers:
          type: array
          items:
            type: string
          description: Qualifiers on the detection category.
        protection:
          type: [string, "null"]
          enum:
            - blocked
            - partial
            - not_blocked
            - n/a
        detectedAt:
          type: string
          format: date-time
        detectingSource:
          type: string
          maxLength: 255
          description: Source of detection (e.g. "Splunk", "Sentinel").
        detectingRuleRef:
          type: string
          maxLength: 255
          description: Reference to the detection rule that fired.
        alertSeverity:
          type: string
          maxLength: 64
          description: Alert severity (e.g. "high", "medium", "low").
        blueNotes:
          type: string
          maxLength: 4096
          description: Free-form notes from the blue operator.
        scoredBy:
          type: string
          description: User id of the scorer.
        scoredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        outcome:
          type: [string, "null"]
          enum:
            - prevented
            - detected
            - not_detected
            - not_applicable
          description: Derived detection outcome from category × protection. Never stored; computed on read.
        mttdSeconds:
          type: [integer, "null"]
          description: Mean time to detect in seconds (detected_at − started_at). Computed on read; null when either timestamp is missing.

    ExecutionList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Execution"

    RedExecutionPatch:
      type: object
      description: |
        Red-side only PATCH body for an execution. `version` is the
        optimistic-lock field and is required on every call. Detection
        fields are not present — blue writes through a separate endpoint
        (M3-007) with its own type.
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
          description: The version the caller read. Mismatch → 409.
        status:
          $ref: "#/components/schemas/ExecutionStatus"
        startedAt:
          type: string
          format: date-time
          description: When execution began. If omitted on a →running transition, the server sets it to UTC now.
        endedAt:
          type: string
          format: date-time
        commandRun:
          type: string
          maxLength: 4096
        sourceHost:
          type: string
          maxLength: 255
        targetHost:
          type: string
          maxLength: 255
        redNotes:
          type: string
          maxLength: 4096

    BlueDetectionPatch:
      type: object
      description: |
        Blue-side only PATCH body for an execution. `version` is the
        optimistic-lock field and is required on every call. Red fields
        are not present — red writes through a separate endpoint with
        its own type.
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
          description: The version the caller read. Mismatch → 409.
        detectionCategory:
          $ref: "#/components/schemas/DetectionCategory"
        detectionModifiers:
          type: array
          items:
            $ref: "#/components/schemas/DetectionModifier"
          description: Qualifiers on the detection category. Multi-select; empty array allowed.
        protection:
          $ref: "#/components/schemas/Protection"
        detectedAt:
          type: string
          format: date-time
          description: When the first detection fired (UTC).
        detectingSource:
          type: string
          maxLength: 255
          description: Source of detection (e.g. "Splunk", "Sentinel").
        detectingRuleRef:
          type: string
          maxLength: 255
          description: Reference to the detection rule that fired.
        alertSeverity:
          $ref: "#/components/schemas/AlertSeverity"
        blueNotes:
          type: string
          maxLength: 4096
          description: Free-form notes from the blue operator.

    DetectionCategory:
      type: string
      enum:
        - none
        - telemetry
        - general
        - tactic
        - technique
      description: Blue-side detection rating, ordinal 0–4.

    DetectionModifier:
      type: string
      enum:
        - alert
        - correlated
        - delayed
        - config_change
        - residual_artifact
      description: Descriptive flag qualifying a detection without changing its ordinal.

    Protection:
      type: string
      enum:
        - blocked
        - partial
        - not_blocked
        - "n/a"
      description: Blue-side prevention rating.

    AlertSeverity:
      type: string
      enum:
        - info
        - low
        - medium
        - high
        - critical
      description: Alert severity level.

    EvidenceSide:
      type: string
      enum:
        - red
        - blue
      description: Which side uploaded this evidence.

    Evidence:
      type: object
      required:
        - id
        - blobSha256
        - filename
        - caption
        - side
        - executionId
        - uploadedBy
        - uploadedAt
        - size
        - mime
      properties:
        id:
          type: string
          format: uuid
        blobSha256:
          type: string
          minLength: 64
          maxLength: 64
          description: SHA-256 hex digest of the blob content.
        filename:
          type: string
          maxLength: 255
        caption:
          type: string
          maxLength: 4096
        side:
          $ref: "#/components/schemas/EvidenceSide"
        executionId:
          type: string
          format: uuid
          description: The execution this evidence is linked to.
        commentId:
          type: [string, "null"]
          format: uuid
          description: The comment this evidence is linked to (null when execution-only).
        uploadedBy:
          type: string
          description: User id of the uploader.
        uploadedAt:
          type: string
          format: date-time
        size:
          type: integer
          minimum: 0
          description: File size in bytes.
        mime:
          type: string
          maxLength: 255
          description: Stored MIME type from upload.

    NewEvidenceRequest:
      type: object
      required:
        - file
        - side
      properties:
        file:
          type: string
          format: binary
          description: The evidence file.
        caption:
          type: string
          maxLength: 4096
          description: Optional caption for the evidence.
        side:
          $ref: "#/components/schemas/EvidenceSide"
      additionalProperties: false

    Comment:
      type: object
      required:
        - id
        - executionId
        - authorId
        - body
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        executionId:
          type: string
          format: uuid
        authorId:
          type: string
          description: User id of the comment's author.
        body:
          type: string
          maxLength: 16384
          description: Markdown or plain text. 16 KiB limit.
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: [string, "null"]
          format: date-time
          description: Null when never edited; set on first edit and updated thereafter.

    CreateComment:
      type: object
      required:
        - body
      properties:
        body:
          type: string
          maxLength: 16384
          description: Markdown or plain text. 16 KiB limit.
      additionalProperties: false

    PatchComment:
      type: object
      required:
        - body
      properties:
        body:
          type: string
          maxLength: 16384
          description: The replacement body. Prior body is saved as a revision.
      additionalProperties: false

    CommentRevision:
      type: object
      required:
        - id
        - commentId
        - body
        - editedBy
        - editedAt
      properties:
        id:
          type: string
          format: uuid
        commentId:
          type: string
          format: uuid
        body:
          type: string
          description: The body before this edit was applied.
        editedBy:
          type: string
          description: User id of the editor.
        editedAt:
          type: string
          format: date-time

    FindingSeverity:
      type: string
      enum:
        - info
        - low
        - medium
        - high
        - critical
      description: Severity of a finding.

    FindingStatus:
      type: string
      enum:
        - open
        - in_progress
        - resolved
        - accepted_risk
      description: Lifecycle of a remediation finding.

    Finding:
      type: object
      required:
        - id
        - engagementId
        - title
        - description
        - severity
        - recommendation
        - owner
        - status
        - createdAt
        - updatedAt
        - stepIds
      properties:
        id:
          type: string
          format: uuid
        engagementId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 16384
        severity:
          $ref: "#/components/schemas/FindingSeverity"
        recommendation:
          type: string
          maxLength: 16384
        owner:
          type: string
          description: User id of the owner, or empty string.
        status:
          $ref: "#/components/schemas/FindingStatus"
        createdFromExecution:
          type: [string, "null"]
          format: uuid
          description: The execution this finding was created from, if any.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        stepIds:
          type: array
          description: Step ids linked to this finding.
          items:
            type: string
            format: uuid

    NewFinding:
      type: object
      required:
        - title
        - description
        - severity
      properties:
        title:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 16384
        severity:
          $ref: "#/components/schemas/FindingSeverity"
        recommendation:
          type: string
          maxLength: 16384
        owner:
          type: string
          description: User id of the owner; defaults to caller when empty.
        status:
          $ref: "#/components/schemas/FindingStatus"
        createdFromExecution:
          type: string
          format: uuid
          description: Optional execution id this finding originates from.
      additionalProperties: false

    PatchFinding:
      type: object
      properties:
        title:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 16384
        severity:
          $ref: "#/components/schemas/FindingSeverity"
        recommendation:
          type: string
          maxLength: 16384
        owner:
          type: string
        status:
          $ref: "#/components/schemas/FindingStatus"
      additionalProperties: false

    FindingStepIds:
      type: object
      required:
        - stepIds
      properties:
        stepIds:
          type: array
          description: The complete set of step ids for this finding.
          items:
            type: string
            format: uuid
          uniqueItems: true
      additionalProperties: false
