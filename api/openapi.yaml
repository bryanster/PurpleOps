# Blacklight HTTP API — the source of truth for both sides of the wire.
#
# The Go server interface (internal/httpapi/gen) and the TypeScript client
# (web/src/api, M0B-009) are both generated from this file. Hand-writing a
# handler signature or a fetch call that is not described here is a review
# rejection: edit this file, run `make generate`, then implement the method the
# generator produced.
#
# The conventions this file follows are enforced by api/conventions_test.go,
# which runs in `make lint` as well as `make test`. A breach fails the build
# naming the rule it broke, rather than surfacing as a review comment later.
openapi: 3.1.0

info:
  title: Blacklight API
  summary: Purple-team assessments — engagements, scenarios, executions, detections and reports.
  description: |
    The HTTP API of a Blacklight deployment. Single-tenant, single-node: this
    document describes the one server the SPA talks to, and the same endpoints
    are the supported integration surface for scripts and CI.

    All timestamps are UTC, RFC 3339. All identifiers are UUIDv7 strings —
    sortable by creation time, so `ORDER BY id` is a stable tiebreaker.
    Errors are RFC 9457 problem documents; see the `Problem` schema.
  # The revision of this document, not of the running binary — `GET /version`
  # reports the binary. Bump the minor for additive changes, the major for
  # breaking ones (which also means a new `/api/vN` prefix, so a breaking bump
  # should be rare enough to argue about first).
  version: 1.0.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  # Relative on purpose: the SPA is served from this same origin (M0B-010) and
  # there is no CORS, so an absolute URL here would only ever be wrong.
  - url: /api/v1
    description: This deployment.

# Every operation additionally declares what it requires of its *caller*, in one
# of three forms (M1-013). `api/authz.go` reads them, `api/authz_test.go` fails
# CI on a gap, and internal/httpapi refuses to start the server on one — so an
# endpoint added without a thought about permission never becomes an endpoint
# anybody can reach.
#
#   x-authz-action: settings.read          # the authz action, by its wire name
#   x-authz-resource: {type: platform}     # and what it acts on
#
#   x-authz-self: true                     # a signed-in caller, acting on their
#   x-authz-because: …                     # own account and nothing else
#
#   x-authz-public: true                   # no credential, no permission
#   x-authz-because: …
#
# `x-authz-resource` names the path parameters the identifiers come from:
# `{type: engagement, engagement: engagementId}`, and for something inside an
# engagement, `{type: execution, engagement: engagementId, param: executionId}`.
# An engagement-scoped resource must name its engagement; without one, nobody
# needs a membership to reach it.
#
# The three are exclusive and one is mandatory. Absence is not permission.
#
# Authenticated by default. An operation that is genuinely public overrides this
# with `security: []` and says why in its description — so forgetting to think
# about auth fails closed rather than open, which is the failure mode PLAN.md §4
# is written against.
#
# `security` and `x-authz-*` are separate questions: the first is which
# credential an operation takes, the second is what holding it entitles you to.
# `POST /auth/logout` takes a session cookie and requires no permission at all;
# `POST /auth/mfa/totp/verify` takes the pending-MFA cookie instead of a session.
#
# Note: the kin-openapi request validator refuses to serve any operation that
# carries a security requirement unless it is given an AuthenticationFunc
# (openapi3filter.ErrAuthenticationServiceMissing). M1-003 supplies one, and it
# deliberately answers "yes" to everything — authentication is the middleware's
# job and authorization is M1-013's, and a validator that rejected an anonymous
# request could not serve the 401 problem document this API promises.
security:
  - cookieSession: []
  - bearerServiceToken: []

tags:
  - name: system
    description: Liveness and build identity. No authentication, no state.
  - name: auth
    description: Sessions, MFA, single sign-on and service tokens (M1).
  - name: users
    description: Administration of platform users and their roles (M1).
  - name: settings
    description: Platform-wide policy an administrator sets, and everyone else lives under (M1).
  - name: content
    description: Installable reference content — ATT&CK, Atomic Red Team, Sigma, CTID (M2).
  - name: engagements
    description: Engagements, their members and their retest rounds (M3).
  - name: scenarios
    description: Scenarios and the steps that make up an attack chain (M3).
  - name: executions
    description: One step run in one round — red execution, blue detection, evidence (M3).
  - name: evidence
    description: Evidence upload, download and management (M3-009).
  - name: activity
    description: Append-only activity log — platform feed and per-engagement timeline (M1-015).
  - name: collaboration
    description: Comments, activity, presence and the live event stream (M4).
  - name: analytics
    description: Rollups, coverage, detection timing and round-over-round deltas (M5).
  - name: reports
    description: Report building, rendering and sharing (M6).
  - name: findings
    description: Remediation findings tracked per engagement (M3-011).

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Report whether the server and its dependencies are healthy.
      description: |
        Public by design: an orchestrator or uptime monitor has to be able to call
        this without credentials, and a health check that needs a session reports
        "unhealthy" whenever authentication itself breaks.

        Returns 200 when every check is `ok`, and 503 when any check is `error`.
        The body is the same shape either way — the caller reads `checks` to find
        out *what* is wrong — so the 503 is a health report, not a problem
        document.
      tags:
        - system
      x-authz-public: true
      x-authz-because: an orchestrator has no account, and a health check that needs one reports on the wrong thing.
      security: []
      responses:
        "200":
          description: Every dependency is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: At least one dependency is unhealthy; `checks` says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          $ref: "#/components/responses/InternalError"

  /version:
    get:
      operationId: getVersion
      summary: Return the build identity of the running binary.
      description: |
        Public: the SPA shows it in the footer and on the login page, and support
        requests are unanswerable without it. It reveals a version and a commit
        of software whose source is public anyway.
      tags:
        - system
      x-authz-public: true
      x-authz-because: the login page shows it, and it names software whose source is public anyway.
      security: []
      responses:
        "200":
          description: The build identity of this binary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      operationId: login
      summary: Sign in with an email address and password.
      description: |
        Public, because the caller has no session yet — that is what this
        endpoint issues.

        Every way of failing produces the *same* 401 with the same body: a wrong
        password, an address nobody holds, and a disabled account are
        indistinguishable, so that this endpoint cannot be used to find out who
        has an account here. The server spends the same work on each, too.

        A 200 does not always mean a session. When a second factor is required
        and the caller has one, `status` is `mfa_required`, no *session* cookie
        is set, and they must post a code to `POST /auth/mfa/totp/verify` — or a
        recovery code to `POST /auth/mfa/recovery/verify` (M1-007) — before
        anything is signed in (M1-006).

        When one is required and they have **none**, `status` is
        `mfa_enrolment_required`: a session cookie is set and it may do exactly
        one thing, which is enrol (M1-008). Read `status` rather than assuming.

        Attempts are throttled per account and per client address (M1-004). Once
        either limit trips, every attempt is a 429 with a `Retry-After` — the
        right password included, because a lockout that the right password ends
        is not a lockout. The 429 is identical for an account that exists and one
        that does not.
      tags:
        - auth
      x-authz-public: true
      x-authz-because: this endpoint issues the credential; requiring one to reach it would be a closed door with the key inside.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: |
            The credentials were correct. `status` says whether that was enough:
            `authenticated` means the session cookie in `Set-Cookie` is live,
            `mfa_enrolment_required` means it is live and confined to enrolling,
            and `mfa_required` means there is no session at all yet.
          headers:
            Set-Cookie:
              description: |
                When `status` is `authenticated`: the session cookie, `HttpOnly`,
                `SameSite=Strict`, `Path=/`, and `Secure` on every deployment
                that is not `BLACKLIGHT_ENV=development`. A second `Set-Cookie`
                carries `bl_csrf` (M1-005), with the same attributes except
                that it is **not** `HttpOnly` — script has to read it to send
                `X-CSRF-Token`.

                When `status` is `mfa_enrolment_required`: the same two cookies,
                for a session that is refused everywhere except the two
                enrolment endpoints and `GET /auth/me` (M1-008). It becomes an
                ordinary session, on a new token, the moment an enrolment is
                confirmed.

                When `status` is `mfa_required`: the short-lived `bl_mfa`
                cookie instead, and no session cookie. It authorizes nothing but
                `POST /auth/mfa/totp/verify`; see the `mfaChallenge` scheme.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/logout:
    post:
      operationId: logout
      summary: End the current session.
      description: |
        Revokes the session server-side and clears the cookie. A replay of the
        old cookie afterwards is a 401 — the session is ended in the database,
        not merely forgotten by the browser.

        A request that carries no usable session is a 204 as well: the caller
        wanted to be signed out, and they are.
      tags:
        - auth
      x-authz-public: true
      x-authz-because: ending a session grants nothing, and a caller with no session is answered the same 204.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: The session is revoked and the cookie cleared.
          headers:
            Set-Cookie:
              description: |
                The expired session cookie, which clears the browser's copy. The
                `bl_csrf` cookie is cleared alongside it, in a second
                `Set-Cookie` — the two are issued together and dropped together.
              required: true
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Return the signed-in user, their platform role and their engagement memberships.
      description: |
        Everything the interface needs to decide what to show: who you are, what
        you may do to this installation, which engagements you are in and with
        which role, and whether this session has satisfied MFA.

        It never returns anything about the session token. What is in the cookie
        stays in the cookie.
      tags:
        - auth
      x-authz-self: true
      x-authz-because: your own profile, and the only account this operation can name is the one that asked.
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/password:
    post:
      operationId: changePassword
      summary: Change your own password.
      description: |
        Requires the current password, so that a borrowed browser cannot be used
        to take an account over.

        On success the current session is rotated — a new token for the same
        session, in a new cookie — and every *other* session belonging to this
        user is revoked. Changing your password signs out the places you did not
        change it from.
      tags:
        - auth
      x-authz-self: true
      x-authz-because: your own password, proved with the current one; no role makes it more or less allowed.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: The password was changed, this session rotated, and every other one revoked.
          headers:
            Set-Cookie:
              description: |
                The rotated session cookie. The token it replaces stops working,
                and the matching `bl_csrf` cookie is set in a second
                `Set-Cookie`: the CSRF token is derived from the session token,
                so it rotates with it.
              required: true
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/sessions:
    get:
      operationId: listSessions
      summary: List the browsers you are currently signed in on.
      description: |
        Your own live sessions, newest first, and nobody else's — there is no
        parameter that names another account. An administrator wanting somebody
        else's reaches for `POST /users/{userId}/sessions/revoke`, which ends
        them rather than reading them.

        **Live** means what the authentication middleware means by it: not
        revoked, not past its absolute expiry, and not idle for longer than the
        idle timeout. The same function decides both, so this list cannot
        disagree with what would actually be accepted on the next request — a
        row here is a browser that could act right now, which is what makes
        revoking one worth doing.

        `current` marks the session this request arrived on. It is the one row a
        client should not offer an ordinary "revoke" for: ending it is signing
        out, and `POST /auth/logout` is where that lives, with the cookie
        clearing that goes with it.

        No token and no hash of one. What is in the cookie stays in the cookie.
      tags:
        - auth
      x-authz-action: session.read
      x-authz-resource:
        type: session
      responses:
        "200":
          description: Your live sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sessions"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      summary: Sign yourself out everywhere except here.
      description: |
        Ends every session you hold except the one making the request, and
        reports how many. The browser doing the asking keeps working, which is
        what separates this from signing out.

        It is the one control that is useful without reading the list first: the
        person who has just remembered a laptop in a hotel does not need to
        identify which row it is.

        Idempotent, and `revoked: 0` is a normal answer for somebody signed in
        only here. Service tokens are not sessions and are untouched — those are
        `DELETE /auth/tokens/{tokenId}`.
      tags:
        - auth
      x-authz-action: session.manage
      x-authz-resource:
        type: session
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: How many other sessions were ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokedSessions"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      summary: Revoke one of your own sessions.
      description: |
        Takes effect at that browser's next request: the row is revoked, and
        every request resolves its session from the row rather than from
        anything cached.

        A session belonging to somebody else answers `404`, exactly as an
        identifier that names nothing does, and for the same reason
        `DELETE /auth/tokens/{tokenId}` does: an endpoint that answered `403`
        for real identifiers and `404` for invented ones would be a way to find
        out which are real.

        Revoking the session making the request is allowed and is a way to sign
        out — but it leaves this browser holding a cookie nothing accepts and
        nothing told it to drop, so `POST /auth/logout` is the operation for
        that. Clients should offer it for the other rows.
      tags:
        - auth
      x-authz-action: session.manage
      x-authz-resource:
        type: session
        param: sessionId
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: sessionId
          in: path
          required: true
          description: The session's `id`, from `GET /auth/sessions`. Never the token in the cookie.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The session is revoked, or already was.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/mfa/totp/enroll:
    post:
      operationId: enrollTotp
      summary: Start enrolling an authenticator app.
      description: |
        Mints a fresh shared secret and returns it three ways: as an
        `otpauth://` URI, as a QR code to point a camera at, and as the base32
        string to type in when the camera will not focus.

        The secret is **unconfirmed** until `POST /auth/mfa/totp/confirm`
        succeeds. An unconfirmed secret gates nothing — a browser closed between
        this call and that one leaves the account exactly as it was, which is
        what stops a half-finished enrolment locking somebody out.

        Calling this again replaces an unconfirmed secret, so a re-scan works.
        It refuses with `409` when a *confirmed* authenticator already exists:
        replacing one is `DELETE /auth/mfa/totp` followed by this, and that
        needs the current password.

        This is the only response that ever carries the secret.
      tags:
        - auth
      x-authz-self: true
      x-authz-because: your own second factor, on your own account.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: A new, unconfirmed secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPEnrolment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/mfa/totp/confirm:
    post:
      operationId: confirmTotp
      summary: Confirm an enrolment by presenting a code from it.
      description: |
        Proves the authenticator was actually set up. On success the enrolment
        becomes the second factor this account is asked for at sign-in, this
        session is marked as having satisfied MFA, and it is rotated onto a new
        token — satisfying a factor is a privilege change, and PLAN.md §4 wants
        the token to change whenever that is true.

        It also mints ten **recovery codes** (M1-007) and returns them in the
        body. This is the only response in the API that ever carries them: there
        is no endpoint that reads them back, because the server keeps only their
        hashes. A client that does not put them in front of the person right
        now has lost them, and the only remedy is
        `POST /auth/mfa/recovery/regenerate`, which mints a different set.

        A wrong code is a `400` naming the `code` field, not a `401`: the caller
        is signed in and this is a form to correct, not a session to re-establish.
        It is deliberately not throttled — the only secret being guessed is the
        caller's own, and getting it right grants them nothing they did not
        already have.
      tags:
        - auth
      x-authz-self: true
      x-authz-because: the other half of enrolling your own second factor.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: |
            The enrolment is confirmed, this session rotated, and the recovery
            codes minted. Show them.
          headers:
            Set-Cookie:
              description: |
                The rotated session cookie, with its matching `bl_csrf` cookie
                in a second `Set-Cookie`.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/mfa/totp/verify:
    post:
      operationId: verifyTotp
      summary: Complete a sign-in by presenting a code from your authenticator.
      description: |
        The second half of a sign-in that answered `mfa_required`. It carries no
        session — that is the point: the credential is the short-lived
        `bl_mfa` cookie set by `POST /auth/login`, which authorizes nothing
        except this endpoint and expires in minutes.

        On success the pending state is spent, a session is issued with MFA
        satisfied, and the `bl_mfa` cookie is cleared. One correct code buys
        exactly one session.

        Every way of failing is the same `401`: a wrong code, a code already
        used, an expired pending state, and no pending state at all. Attempts
        are throttled per account and per client address alongside password
        attempts (M1-004), and the `429` is identical whichever limit closed.
      tags:
        - auth
      x-authz-public: true
      x-authz-because: half of a sign-in, on the pending cookie; there is no session yet to hold a permission.
      security:
        - mfaChallenge: []
      responses:
        "200":
          description: |
            The code was correct. `status` is always `authenticated` — there is
            no third factor to ask for.
          headers:
            Set-Cookie:
              description: |
                The session cookie, its `bl_csrf` companion, and the cleared
                `bl_mfa` cookie, in three `Set-Cookie` headers.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"

  /auth/mfa/recovery/verify:
    post:
      operationId: verifyRecoveryCode
      summary: Complete a sign-in with a recovery code instead of an authenticator.
      description: |
        The other way out of `mfa_required`, for the person whose phone is in a
        river (M1-007). It takes the same short-lived `bl_mfa` cookie as
        `POST /auth/mfa/totp/verify` and one of the codes issued when the
        authenticator was enrolled.

        A code works exactly once. On success it is marked used, the pending
        state is spent, and a session is issued with MFA **satisfied** — this is
        a full sign-in and not a diminished one, because someone holding a
        printed code has presented a second factor. `GET /auth/me` then reports
        `mfa.recoveryCodesRemaining` one lower; below three, warn them.

        Every way of failing is the same `401` as the TOTP endpoint's: a code
        that is not theirs, one already used, one that is not a code at all, an
        expired pending state and no pending state at all. Attempts are
        throttled per account and per client address alongside password and
        TOTP attempts (M1-004).
      tags:
        - auth
      x-authz-public: true
      x-authz-because: the same half of the same sign-in, reached with a printed code instead.
      security:
        - mfaChallenge: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryCodeRequest"
      responses:
        "200":
          description: |
            The code was correct and is now spent. `status` is always
            `authenticated`.
          headers:
            Set-Cookie:
              description: |
                The session cookie, its `bl_csrf` companion, and the cleared
                `bl_mfa` cookie, in three `Set-Cookie` headers.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/mfa/recovery/regenerate:
    post:
      operationId: regenerateRecoveryCodes
      summary: Replace your recovery codes with a fresh set.
      description: |
        Mints ten new codes and **invalidates every previous one**, including
        the codes that were never used. Somebody regenerating because a printout
        went missing is telling us the missing printout must stop working.

        It asks for two things. The current password, so that a session left
        open on a shared machine cannot mint credentials that walk past a second
        factor. And a session that has already satisfied MFA — `403` otherwise.
        Deliberately *not* a fresh code from the authenticator: signing in with
        a recovery code produces a satisfied session, so this is reachable by
        the person whose phone is gone, which is the case recovery codes exist
        for.

        `409` when no authenticator is enrolled: codes stand in for one, and
        there has to be one to stand in for.

        Like the enrolment response, this is the only time the new codes exist
        outside the client.
      tags:
        - auth
      x-authz-self: true
      x-authz-because: your own recovery codes, proved with your own password and a session that satisfied MFA.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateRecoveryCodesRequest"
      responses:
        "200":
          description: A new set of codes. Every earlier code is now dead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/mfa/totp:
    delete:
      operationId: disableTotp
      summary: Remove your authenticator.
      description: |
        Requires the current password, for the same reason changing a password
        does: a session left open on a shared machine must not be enough to take
        the second factor off an account.

        The recovery codes go with it (M1-007). They stand in for the
        authenticator, so leaving them behind would mean a second factor that
        was removed is still presentable — and the next enrolment mints its own
        set, so keeping these could only ever mean two live sets.

        Refused with `403` when a second factor is required of this person
        (M1-008) — by the platform policy or by their own `mfaEnforced` flag,
        which are the same answer here. Removing it would leave an account
        subject to a requirement it can no longer satisfy, which is a lockout
        rather than a choice. `mfa.required` on `GET /auth/me` says in advance
        whether this call will be refused.
      tags:
        - auth
      x-authz-self: true
      x-authz-because: removing your own second factor, proved with your own password.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisableTOTPRequest"
      responses:
        "204":
          description: |
            The authenticator and the recovery codes are removed. Removing one
            that was not there answers the same way.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/tokens:
    get:
      operationId: listServiceTokens
      summary: List your own service tokens.
      description: |
        Your tokens, newest first, including the expired and revoked ones — you
        cannot decide whether to rotate something you cannot see the history of.

        No secret is here, and none could be: the server stores a hash, so it
        could not produce a token's value if asked. `prefix` is what identifies
        a row to a human, and it is the same value that appears in the middle of
        the token itself.

        Yours and nobody else's. There is no parameter that names another
        account, and an administrator calling this sees their own tokens like
        everybody else. An administrator who needs to see somebody else's has
        `GET /users/{userId}/tokens`, which is a different permission and a
        different endpoint — this one never widens.
      tags:
        - auth
      x-authz-action: token.read
      x-authz-resource:
        type: service_token
      responses:
        "200":
          description: Your tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceTokens"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createServiceToken
      summary: Create a service token, shown once.
      description: |
        Mints a token owned by you. **The response is the only time its secret
        exists outside your client** — it is stored as a hash and cannot be
        recovered, so a caller that does not save it has to create another one.

        What the token may do is fenced twice, and the narrower fence wins on
        every request:

        1. The scopes you give it here.
        2. Your own permissions, read live on every request the token makes.
           Being demoted narrows every token you hold, immediately, without
           touching them; having your account disabled stops them entirely.

        `engagementId` adds a third fence, and only ever subtracts: a token
        bound to an engagement reaches that engagement and nothing else — not
        another engagement, not the installation — whatever its scopes say. It
        cannot let a token into an engagement you are not a member of.

        `expiresAt` is required and is capped at a year out. A credential with
        no expiry is one nobody remembers to revoke.

        A service token cannot call this. Creating credentials takes a signed-in
        session, so that a leaked token cannot mint a longer-lived replacement
        for itself and outlive its own revocation — `403` with `code:
        "forbidden"` when one tries, whatever scopes it carries.
      tags:
        - auth
      x-authz-action: token.manage
      x-authz-resource:
        type: service_token
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceTokenRequest"
      responses:
        "201":
          description: |
            The token was created. `token` is in this response and in no other,
            ever — not in the listing, not in the log, not in the activity feed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedServiceToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/tokens/{tokenId}:
    delete:
      operationId: revokeServiceToken
      summary: Revoke one of your own service tokens.
      description: |
        Takes effect on the token's next request: there is no cached copy of it
        anywhere, so there is no window during which it still works.

        Idempotent — revoking a token that has already been revoked answers the
        same way, and keeps the original revocation time, because the first
        revocation is when access actually stopped.

        A token belonging to somebody else answers `404`, exactly as an
        identifier that names nothing does. The two are indistinguishable on
        purpose: an endpoint that answered `403` for real identifiers and `404`
        for invented ones would be a way to find out which are real. An
        administrator revoking somebody else's uses
        `DELETE /users/{userId}/tokens/{tokenId}`, which names the account.

        As with creation, a service token cannot call this.
      tags:
        - auth
      x-authz-action: token.manage
      x-authz-resource:
        type: service_token
        param: tokenId
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: tokenId
          in: path
          required: true
          description: The token's `id`, from `GET /auth/tokens`. Never its prefix and never its secret.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The token is revoked, or already was.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/providers:
    get:
      operationId: getAuthProviders
      summary: List the ways this deployment can be signed in to.
      description: |
        Public, because it is what the login page reads *before* anybody has
        signed in — it is the list of buttons to draw.

        `password` is whether local sign-in is offered, and `sso` is one entry
        per configured single sign-on provider, each with the URL to send the
        browser to.

        A provider that is configured but cannot be reached is **absent** from
        `sso` (M1-009). That is deliberate and it is the point of this endpoint:
        a button that leads to a provider which is down is worse than no button,
        and an identity provider having a bad morning must never be the reason
        nobody can get in. It reappears on its own, with no restart, once the
        provider answers again.

        It reveals that a deployment has single sign-on and which protocol, which
        is visible from the sign-in page of every such product and is not a
        secret. It reveals nothing about the client, the issuer or the mapping.
      tags:
        - auth
      x-authz-public: true
      x-authz-because: the login page reads it before anybody has signed in, to know which buttons to draw.
      security: []
      responses:
        "200":
          description: The sign-in methods on offer right now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviders"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/oidc/start:
    get:
      operationId: startOidcSignIn
      summary: Begin a single sign-on through the configured OIDC provider.
      description: |
        Redirects the browser to the identity provider's authorization endpoint
        with PKCE, `state` and `nonce`, and sets a short-lived, sealed cookie
        holding all three (M1-009). It is a navigation rather than a fetch: send
        the browser here, do not call it with `fetch`.

        `return_to` is where to land afterwards and must be a path within this
        application — a relative path beginning with a single `/`. Anything else
        is a `400`: an endpoint that redirects wherever a query parameter says is
        an open redirect, and an open redirect on the login path is a credible
        phishing page on your own domain.

        `404` when no provider is configured, or when the configured one cannot
        be reached. Local sign-in is unaffected either way.
      tags:
        - auth
      x-authz-public: true
      x-authz-because: this is where a sign-in begins; requiring a session to reach it would be a closed door with the key inside.
      security: []
      parameters:
        - name: return_to
          in: query
          required: false
          description: |
            A path within this application to return to after signing in, such
            as `/engagements/018f…`. Absolute URLs, scheme-relative URLs and
            anything containing a backslash or a control character are refused.
          schema:
            type: string
            maxLength: 512
      responses:
        "302":
          description: |
            Go to the identity provider. The `Set-Cookie` carries the sealed
            pending state, which the callback needs.
          headers:
            Location:
              description: The provider's authorization endpoint, with the request parameters.
              required: true
              schema:
                type: string
            Set-Cookie:
              description: |
                The `bl_oidc` cookie: `HttpOnly`, `SameSite=Lax`, scoped to the
                OIDC endpoints, and `Secure` on every deployment that is not
                `BLACKLIGHT_ENV=development`. Lax rather than Strict because the
                callback is a top-level navigation from another site, and a
                Strict cookie is not sent on one.
              required: true
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/oidc/callback:
    get:
      operationId: completeOidcSignIn
      summary: Complete a single sign-on and issue a session.
      description: |
        Where the identity provider sends the browser back. Register
        `<BLACKLIGHT_BASE_URL>/api/v1/auth/oidc/callback` as the redirect URI at
        the provider; it must match byte for byte.

        On success this behaves exactly like `POST /auth/login` with `status:
        authenticated`: the session cookie and the `bl_csrf` cookie are set, and
        the browser is redirected to `return_to` — or to `/` when the sign-in
        named none. The pending-state cookie is cleared, which is what makes a
        `state` single-use.

        The failures are worth telling apart, and none of them is a redirect:

        - `401` — the callback does not belong to a sign-in this browser started
          (no cookie, a `state` that does not match, an expired one), or the ID
          token did not verify. Start again.
        - `403` — the provider vouched for somebody this deployment has no
          account for and `BLACKLIGHT_OIDC_AUTO_PROVISION` is off, or the account
          is disabled. The message says which and what to do about it; no account
          is created.
        - `404` — no provider is configured.

        A second factor still applies. An account that also has a local password
        and a confirmed authenticator is answered `mfa_required` in the same way
        a local sign-in is, and lands on the code entry page rather than signed
        in (M1-006, M1-008).
      tags:
        - auth
      x-authz-public: true
      x-authz-because: this is what issues the credential; the proof is the signed ID token and the state cookie, not a session.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          description: The authorization code, when the provider is granting one.
          schema:
            type: string
            maxLength: 4096
        - name: state
          in: query
          required: false
          description: The opaque value this sign-in was started with. Required in practice; a callback without one is refused.
          schema:
            type: string
            maxLength: 512
        - name: error
          in: query
          required: false
          description: The provider's error code, when it is refusing rather than granting — `access_denied` when consent was declined.
          schema:
            type: string
            maxLength: 256
        - name: error_description
          in: query
          required: false
          description: The provider's prose about that error. It is logged and never rendered.
          schema:
            type: string
            maxLength: 1024
      responses:
        "302":
          description: |
            Signed in. The browser is sent to the path the sign-in named, or to
            `/`.
          headers:
            Location:
              description: A path within this application, never an absolute URL.
              required: true
              schema:
                type: string
            Set-Cookie:
              description: |
                The session cookie, with `bl_csrf` and the cleared `bl_oidc` in
                further `Set-Cookie` headers. When a second factor is required,
                the short-lived `bl_mfa` cookie instead of the session — read
                `Location`, which is the code entry page in that case.
              required: true
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/saml/metadata:
    get:
      operationId: getSamlMetadata
      summary: Serve this deployment's SAML service provider metadata.
      description: |
        The XML an identity provider administrator uploads, or points their
        console at, to register this deployment as a service provider (M1-010).
        It carries the entity ID, the assertion consumer service URL and the
        signing certificate.

        It is public and it is meant to be: every field in it is something the
        identity provider is about to be told anyway, and half of them are
        already visible in the authentication request the browser carries. The
        **private** key never appears here — only the certificate, which is the
        public half.

        `404` when this deployment has no SAML configured.
      tags:
        - auth
      x-authz-public: true
      x-authz-because: an identity provider administrator fetches it before any account here exists, and it carries only public registration facts.
      security: []
      responses:
        "200":
          description: The service provider metadata.
          content:
            application/samlmetadata+xml:
              schema:
                type: string
                description: A `<md:EntityDescriptor>` document.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/saml/start:
    get:
      operationId: startSamlSignIn
      summary: Begin a single sign-on through the configured SAML provider.
      description: |
        Redirects the browser to the identity provider's single sign-on service
        with a signed `AuthnRequest` (HTTP-Redirect binding), and sets a
        short-lived, sealed cookie holding that request's ID and where to land
        afterwards. It is a navigation rather than a fetch: send the browser
        here, do not call it with `fetch`.

        `return_to` is where to land afterwards and must be a path within this
        application, exactly as it is for `GET /auth/oidc/start`, and for the
        same reason: an endpoint that redirects wherever a query parameter says
        is an open redirect on the login path.

        `404` when no provider is configured, or when the configured one's
        metadata could not be read. Local sign-in is unaffected either way.
      tags:
        - auth
      x-authz-public: true
      x-authz-because: this is where a sign-in begins; requiring a session to reach it would be a closed door with the key inside.
      security: []
      parameters:
        - name: return_to
          in: query
          required: false
          description: |
            A path within this application to return to after signing in. The
            same rule as `GET /auth/oidc/start`: absolute URLs, scheme-relative
            URLs and anything containing a backslash or a control character are
            refused.
          schema:
            type: string
            maxLength: 512
      responses:
        "302":
          description: |
            Go to the identity provider. The `Set-Cookie` carries the sealed
            pending request, which the assertion consumer needs.
          headers:
            Location:
              description: The provider's single sign-on service, with the encoded request.
              required: true
              schema:
                type: string
            Set-Cookie:
              description: |
                The `bl_saml` cookie: `HttpOnly`, `Secure`, and
                `SameSite=None` — which is the one cookie in this application
                that is neither Strict nor Lax. The assertion arrives as a
                cross-site **POST**, and a browser sends neither a Strict nor a
                Lax cookie on one, so anything stricter would mean the cookie
                never comes back and no sign-in ever completes.
              required: true
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/saml/acs:
    post:
      operationId: completeSamlSignIn
      summary: Consume a SAML assertion and issue a session.
      description: |
        The assertion consumer service. The identity provider POSTs a form here
        from the browser; register
        `<BLACKLIGHT_BASE_URL>/api/v1/auth/saml/acs` as the ACS URL, and it must
        match byte for byte — it is checked against the assertion's `Recipient`
        and the response's `Destination`.

        On success this behaves exactly like `POST /auth/login` with `status:
        authenticated`: the session cookie and the `bl_csrf` cookie are set, and
        the browser is redirected to the path the sign-in named, or to `/`.

        Both SP-initiated and IdP-initiated sign-in are accepted. An
        SP-initiated one is additionally bound to the browser that started it —
        the sealed cookie names the request ID the assertion must answer, so an
        assertion delivered into somebody else's browser is refused. An
        IdP-initiated one has no request to answer and so cannot have that
        binding; set `BLACKLIGHT_SAML_ALLOW_IDP_INITIATED=false` on a deployment
        that does not need it.

        The failures, and none of them is a redirect:

        - `401` — the assertion was rejected. Unsigned, signed by a key that is
          not the provider's, tampered with, outside its validity window,
          addressed to somebody else, or one that has already been used. Which
          of those it was is in the log and never in the response.
        - `403` — the assertion was good and this deployment will not sign that
          person in: no account and `BLACKLIGHT_SAML_AUTO_PROVISION` is off, or
          the account is disabled.
        - `404` — no provider is configured.

        A second factor still applies, exactly as it does for OIDC (M1-006,
        M1-008).
      tags:
        - auth
      x-authz-public: true
      x-authz-because: this is what issues the credential; the proof is the signed assertion and the sealed request cookie, not a session.
      security: []
      requestBody:
        required: true
        description: |
          The form the identity provider POSTs, per the SAML 2.0 HTTP-POST
          binding. Nothing else is accepted: the binding defines these two
          fields and a provider sending a third is one this deployment does not
          understand.
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required:
                - SAMLResponse
              properties:
                SAMLResponse:
                  type: string
                  description: The base64-encoded `<samlp:Response>`.
                  maxLength: 1048576
                RelayState:
                  type: string
                  description: |
                    Echoed back from the authentication request, or set by the
                    provider for an IdP-initiated sign-in. It is **not** trusted
                    and nothing is read out of it: the SAML profile caps it at 80
                    bytes, which is too small to seal, so everything this sign-in
                    needs to remember is in the `bl_saml` cookie instead.
                  maxLength: 80
      responses:
        "302":
          description: |
            Signed in. The browser is sent to the path the sign-in named, or to
            `/`.
          headers:
            Location:
              description: A path within this application, never an absolute URL.
              required: true
              schema:
                type: string
            Set-Cookie:
              description: |
                The session cookie, with `bl_csrf` and the cleared `bl_saml` in
                further `Set-Cookie` headers. When a second factor is required,
                the short-lived `bl_mfa` cookie instead of the session — read
                `Location`, which is the code entry page in that case.
              required: true
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /users:
    get:
      operationId: listUsers
      summary: List the accounts on this installation.
      description: |
        Administrators only. Every account, oldest first, with the standard
        cursor pagination — `limit` is capped at 200 by the shared parameter, so
        a caller cannot ask for the whole table in one request.

        Narrow it with `status`, `role` and `q`. The search matches the display
        name or the email address, without regard to case, anywhere in either.

        No response here carries a password hash, an authenticator secret, a
        recovery code or a session token. None of those is a field of the `User`
        schema, which is what makes that a property of the document rather than
        a promise about the implementation.
      tags:
        - users
      x-authz-action: user.read
      x-authz-resource:
        type: user
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/UserStatusFilter"
        - $ref: "#/components/parameters/UserRoleFilter"
        - $ref: "#/components/parameters/UserSearch"
      responses:
        "200":
          description: A page of accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createUser
      summary: Create an account.
      description: |
        Administrators only. There is no email transport in this deployment, so
        nothing is sent: the response carries `inviteUrl`, which is where this
        installation is signed in to, and the administrator passes it on
        themselves along with whatever credential they chose.

        Two shapes of account, and `password` is what picks between them:

        - **With a password.** A local account, `active` by default. Tell the
          person the address, the password and the link, and they change the
          password once they are in.
        - **Without one.** An account that signs in through the identity
          provider, `invited` by default — it exists and nobody has claimed it.
          The first successful single sign-on that resolves to this address
          claims it, and the account becomes `active` at that moment.

        An address already in use — in any casing, with any surrounding
        whitespace — is `409`, never a 500 and never a second account.
      tags:
        - users
      x-authz-action: user.manage
      x-authz-resource:
        type: user
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/me:
    patch:
      operationId: updateCurrentUser
      summary: Change your own display name.
      description: |
        The self-service half of user administration, and deliberately the
        smallest one that could exist: a display name and nothing else.

        Your platform role and your status are **not** fields of this request.
        Not filtered out of it — absent from it, so a body that names one is
        rejected by the request validator with `400` before any handler runs
        (PLAN.md §4: "field safety comes from the schema"). Raising your own
        privilege through this endpoint is not something the server declines to
        do; it is something there is no way to ask for.
      tags:
        - users
      x-authz-self: true
      x-authz-because: your own display name, and this request has no field that could name anybody else's account.
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSelfRequest"
      responses:
        "200":
          description: Your account as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/{userId}:
    get:
      operationId: getUser
      summary: Read one account.
      description: Administrators only. The same shape the listing returns, and carrying no more than it does.
      tags:
        - users
      x-authz-action: user.read
      x-authz-resource:
        type: user
        param: userId
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateUser
      summary: Edit an account's name, platform role, status or MFA requirement.
      description: |
        Administrators only, and a patch rather than a replacement: a field that
        is absent is left alone, so two administrators editing different things
        at once do not overwrite each other's change.

        The email address is not editable here. It is the identifier a federated
        sign-in links an account by, and changing it would move somebody else's
        single sign-on onto this account.

        Changing `platformRole` takes effect on the target's **existing**
        session, at their next request, without them signing in again — the role
        is read from the account on every request and nothing caches it. The
        same is true in the other direction: a promotion applies immediately too.

        Setting `status` to `disabled` does what `POST /users/{userId}/disable`
        does, including revoking the account's sessions.

        The last account that is both `admin` and `active` cannot be demoted or
        disabled: `409`, saying so. An installation with no administrator is one
        nobody can administer, and no request should be able to produce it.
      tags:
        - users
      x-authz-action: user.manage
      x-authz-resource:
        type: user
        param: userId
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The account as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteUser
      summary: Retire an account.
      description: |
        Administrators only, and a **soft** delete: the account's status becomes
        `disabled` and the row stays. It is the same operation as
        `POST /users/{userId}/disable`, spelled the way a client that thinks in
        resources expects, and it answers with the account so that the caller
        can see it is still there.

        Nothing here removes an account. The executions, comments and findings
        somebody wrote keep their author, and a hard delete would either orphan
        or rewrite that history — a database administrator's decision, not an
        API call (`M1-001`).

        The last `admin` who is still `active` cannot be retired: `409`.
      tags:
        - users
      x-authz-action: user.manage
      x-authz-resource:
        type: user
        param: userId
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: The account, now disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/{userId}/disable:
    post:
      operationId: disableUser
      summary: Disable an account, ending its access at once.
      description: |
        Administrators only. Every session the account holds is revoked, and
        every service token it owns stops working on its next request — a
        token's permissions are its owner's, read live, so an owner who is not
        `active` has none to spend.

        Idempotent: disabling an account that is already disabled answers the
        same way.

        The last `admin` who is still `active` cannot be disabled: `409`.
      tags:
        - users
      x-authz-action: user.manage
      x-authz-resource:
        type: user
        param: userId
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: The account, now disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/{userId}/enable:
    post:
      operationId: enableUser
      summary: Enable an account.
      description: |
        Administrators only. The account becomes `active`. Sessions revoked
        while it was disabled stay revoked — enabling somebody gives them their
        account back, not the browser tab they had open a month ago.

        Idempotent, and the way an `invited` account that will never use single
        sign-on is turned on by hand.
      tags:
        - users
      x-authz-action: user.manage
      x-authz-resource:
        type: user
        param: userId
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: The account, now active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/{userId}/sessions/revoke:
    post:
      operationId: revokeUserSessions
      summary: Sign an account out everywhere.
      description: |
        Administrators only. Ends every live session the account holds, at once
        and without disabling it — what an administrator reaches for when a
        laptop goes missing and the person still needs their account tomorrow.

        Service tokens are not sessions and are not touched. Use
        `POST /users/{userId}/disable` to stop those as well.

        Idempotent: an account with nothing live answers `200` and `revoked: 0`.
      tags:
        - users
      x-authz-action: user.manage
      x-authz-resource:
        type: user
        param: userId
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: How many sessions were ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokedSessions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/{userId}/tokens:
    get:
      operationId: listUserTokens
      summary: List the service tokens one account holds.
      description: |
        Administrators only, and the question an incident starts with: what does
        this account hold, and when was each of them last used? Until this
        endpoint the answer needed a SQL console, at exactly the moment nobody
        wants to be reaching for one.

        The same shape and the same renderer as `GET /auth/tokens`, including
        the expired and revoked rows — an administrator working from a
        different set from the owner's is an administrator working from a
        second account of what exists. No secret is here, for the reason no
        secret is there: the server keeps a hash and could not produce one if
        asked.

        What this is *instead of* is disabling the account. Disabling stops
        every token it holds, and it stops the person too; this stops one
        credential and leaves them able to work.

        A service token cannot call this, whatever it is scoped for and however
        senior its owner — `403`. Reading which credentials exist is the
        business of a person at a keyboard, for the reason
        `POST /auth/tokens` says.
      tags:
        - users
      x-authz-action: token.admin_read
      x-authz-resource:
        type: user
        param: userId
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The account's tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceTokens"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/{userId}/tokens/{tokenId}:
    delete:
      operationId: revokeUserToken
      summary: Revoke one service token belonging to somebody else.
      description: |
        Administrators only. Takes effect on the token's next request, the same
        as the owner revoking it themselves: nothing caches a token anywhere, so
        there is no window in which it still works. The owner's own listing then
        shows it as revoked, carrying the same timestamp — there is one
        revocation and one row, not an administrative copy of one.

        `revokedBy` on the token records who ended it, which is what makes an
        administrative revocation tellable from a routine rotation afterwards.
        The activity log says the same thing under `token.admin_revoked`.

        Idempotent, and it keeps the original revocation time and revoker: the
        first revocation is when access actually stopped, and whoever arrived
        second stopped nothing.

        `tokenId` must belong to `userId`. A token belonging to a different
        account answers `404`, exactly as an identifier that names nothing does
        — so this is not a way to revoke by identifier alone, and not a way to
        find out which identifiers are real.

        As with the listing, a service token cannot call this. That matters most
        here: a leaked credential belonging to an administrator would otherwise
        be able to end every other credential in the installation.
      tags:
        - users
      x-authz-action: token.admin_manage
      x-authz-resource:
        type: user
        param: userId
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CSRFToken"
        - name: tokenId
          in: path
          required: true
          description: The token's `id`, from `GET /users/{userId}/tokens`. Never its prefix and never its secret.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The token is revoked, or already was.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /settings/mfa:
    get:
      operationId: getMfaPolicy
      summary: Read the platform-wide multi-factor authentication policy.
      description: |
        Administrators only. What every ordinary caller needs to know about the
        requirement — whether it applies to *them* — is on `GET /auth/me` as
        `mfa.required`, which is a fact about one person rather than the policy
        that produced it.
      tags:
        - settings
      x-authz-action: settings.read
      x-authz-resource:
        type: platform
      responses:
        "200":
          description: The policy as it stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAPolicy"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: setMfaPolicy
      summary: Replace the platform-wide multi-factor authentication policy.
      description: |
        Administrators only, and a whole replacement rather than a patch: both
        fields are required, so two administrators editing at once cannot each
        change the half they were thinking about and silently keep the other's.

        Turning a requirement **on** takes effect on the next request every
        signed-in user makes, not at their next sign-in. Somebody who is already
        signed in and has not enrolled is confined to enrolling; somebody who is
        enrolled but whose session never presented a factor is signed out and
        must sign in again (M1-008).

        Turning it **off** deletes nothing. Enrolments, recovery codes and the
        per-user `mfaEnforced` flag all survive, so switching it back on does not
        make everybody enrol again.
      tags:
        - settings
      x-authz-action: settings.manage
      x-authz-resource:
        type: platform
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAPolicy"
      responses:
        "200":
          description: The policy as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /activity:
    get:
      operationId: listActivity
      summary: List the installation-wide activity log.
      description: |
        Administrators only. Platform events — logins, lockouts, token lifecycle,
        MFA changes, role changes — with no engagement. Engagement-scoped rows
        are not included; use `GET /engagements/{engagementId}/activity` for
        those.

        Newest first. Pagination is the standard cursor convention. Filter by
        actor, verb or object to narrow an incident review.
      tags:
        - activity
      x-authz-action: activity.read
      x-authz-resource:
        type: platform
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/ActivityActor"
        - $ref: "#/components/parameters/ActivityVerb"
        - $ref: "#/components/parameters/ActivityObjectType"
        - $ref: "#/components/parameters/ActivityObjectId"
      responses:
        "200":
          description: A page of activity entries, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"


  /engagements:
    post:
      operationId: createEngagement
      summary: Create a new engagement.
      description: |
        The creator becomes **lead** member in the same transaction.
        `attack_version` must pass attackpin.AssertPinned — an unknown,
        disabled or empty ATT&CK version is refused.
      tags:
        - engagements
      x-authz-action: engagement.create
      x-authz-resource:
        type: platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEngagement"
      responses:
        "201":
          description: The engagement was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Engagement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listEngagements
      summary: List engagements the caller can see.
      description: |
        Platform administrators see every engagement. Members see only the ones
        they belong to. Non-members see an empty list — the existence of an
        engagement is not revealed to someone outside it.
      tags:
        - engagements
      x-authz-self: true
      x-authz-because: listing returns only what the caller can see; the handler filters by membership
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by engagement status.
          schema:
            type: string
            enum: [draft, active, closed, archived]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of engagements, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /engagements/{engagementId}:
    get:
      operationId: getEngagement
      summary: Return one engagement.
      description: |
        Members and platform administrators. A non-member receives 404 rather
        than 403, so the existence of an engagement is not confirmed.
      tags:
        - engagements
      x-authz-action: engagement.read
      x-authz-resource:
        type: engagement
        engagement: engagementId
      parameters:
        - $ref: "#/components/parameters/EngagementId"
      responses:
        "200":
          description: The engagement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Engagement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: patchEngagement
      summary: Patch engagement fields.
      description: |
        Lead and platform administrators. Every field is optional; only the ones
        present are changed. Changing `attack_version` after any step exists
        returns 409.
      tags:
        - engagements
      x-authz-action: engagement.manage
      x-authz-resource:
        type: engagement
        engagement: engagementId
      parameters:
        - $ref: "#/components/parameters/EngagementId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchEngagement"
      responses:
        "200":
          description: The patched engagement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Engagement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteEngagement
      summary: Delete an engagement and every row in its workbook graph.
      description: |
        Lead and platform administrators. Hard delete: scenarios, steps,
        executions, findings, evidence links, comments, members and
        engagement-scoped activity are removed.
      tags:
        - engagements
      x-authz-action: engagement.delete
      x-authz-resource:
        type: engagement
        engagement: engagementId
      parameters:
        - $ref: "#/components/parameters/EngagementId"
      responses:
        "204":
          description: The engagement and its graph are deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /engagements/{engagementId}/status:
    post:
      operationId: setEngagementStatus
      summary: Transition the engagement to a new status.
      description: |
        Lead and platform administrators. The state machine is:
        `draft` → `active` → `closed` → `archived`, plus `draft` → `closed`.
        Illegal transitions return 409 with a problem detail.
      tags:
        - engagements
      x-authz-action: engagement.manage
      x-authz-resource:
        type: engagement
        engagement: engagementId
      parameters:
        - $ref: "#/components/parameters/EngagementId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEngagementStatus"
      responses:
        "200":
          description: The engagement with its new status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Engagement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /engagements/{engagementId}/activity:
    get:
      operationId: listEngagementActivity
      summary: List one engagement's activity log.
      description: |
        Members of the engagement, and platform administrators. The rows that
        name this engagement — comments, executions, membership changes once
        those exist — newest first.

        A non-member is answered 404 rather than 403, so the existence of an
        engagement is not confirmed to someone outside it.
      tags:
        - activity
      x-authz-action: engagement.read
      x-authz-resource:
        type: engagement
        engagement: engagementId
      parameters:
        - $ref: "#/components/parameters/EngagementId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/ActivityActor"
        - $ref: "#/components/parameters/ActivityVerb"
        - $ref: "#/components/parameters/ActivityObjectType"
        - $ref: "#/components/parameters/ActivityObjectId"
      responses:
        "200":
          description: A page of activity entries, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /engagements/{engagementId}/members:
    get:
      operationId: listEngagementMembers
      summary: List the members of an engagement.
      description: |
        Lead, red, blue, observer, and platform administrators may read the
        member list. A non-member is answered 404 rather than 403, so the
        existence of an engagement is not confirmed.
      tags:
        - engagements
      x-authz-action: member.read
      x-authz-resource:
        type: member
        engagement: engagementId
      parameters:
        - $ref: "#/components/parameters/EngagementId"
      responses:
        "200":
          description: The member list, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EngagementMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: addEngagementMember
      summary: Add a user to an engagement.
      description: |
        Lead and platform administrators. Only `active` users may be added.
        Adding someone who is already a member returns 409. Use PATCH to
        change a member's role.
      tags:
        - engagements
      x-authz-action: member.manage
      x-authz-resource:
        type: member
        engagement: engagementId
      parameters:
        - $ref: "#/components/parameters/EngagementId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
