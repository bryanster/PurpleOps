        param: findingId
      parameters:
        - $ref: "#/components/parameters/FindingId"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchFinding"
      responses:
        "200":
          description: The updated finding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Finding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteFinding
      summary: Delete a finding.
      description: |
        Lead or platform administrator. Deleting a finding also removes its
        finding_step join rows. Closed engagements are permitted.
        Activity: `finding.deleted`.
      tags:
        - findings
      x-authz-action: finding.write
      x-authz-resource:
        type: finding
        engagement: findingId
        param: findingId
      parameters:
        - $ref: "#/components/parameters/FindingId"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Finding deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /findings/{findingId}/steps:
    put:
      operationId: setFindingSteps
      summary: Replace the set of steps linked to a finding.
      description: |
        Lead, red or blue may set the steps linked to this finding. The
        payload is the complete set of step ids; any step not listed is
        unlinked. All step ids must belong to the same engagement as the
        finding.
        Activity: `finding.steps_changed`.
      tags:
        - findings
      x-authz-action: finding.write
      x-authz-resource:
        type: finding
        engagement: findingId
        param: findingId
      parameters:
        - $ref: "#/components/parameters/FindingId"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingStepIds"
      responses:
        "204":
          description: Step set replaced.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: bl_session
      description: |
        Browser session cookie issued by `POST /auth/login` (M1-003): `HttpOnly`,
        `Secure`, `SameSite=Strict`.

        State-changing requests additionally carry a double-submit CSRF token in
        `X-CSRF-Token` (M1-005). OpenAPI cannot express "this scheme also needs
        that header", so the header is declared as a parameter on the operations
        that require it — see `CSRFToken` for why it is nevertheless declared
        optional, and what happens when it is missing.
    mfaChallenge:
      type: apiKey
      in: cookie
      name: bl_mfa
      description: |
        The pending-state cookie set by `POST /auth/login` when a second factor
        is required (M1-006): `HttpOnly`, `Secure`, `SameSite=Strict`, and gone
        within minutes.

        It is emphatically not a session. Nothing resolves one of these into a
        caller — a request carrying only this cookie is anonymous everywhere
        except the two verification endpoints, `POST /auth/mfa/totp/verify` and
        `POST /auth/mfa/recovery/verify`, and `GET /auth/me` answers it with a
        `401`. It is spent by the first code accepted against it, of either
        kind.
    bearerServiceToken:
      type: http
      scheme: bearer
      bearerFormat: bl_<prefix>_<secret>
      description: |
        Scoped, expiring service token (M1-011), sent as
        `Authorization: Bearer bl_<prefix>_<secret>`. Shown once at creation and
        stored only as a hash. A token can never exceed the live permissions of
        the user who owns it.

  parameters:
    # Referenced by every state-changing operation that a browser session may
    # reach, so that the requirement is in the document a client is generated
    # from rather than only in the server's middleware.
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: |
        The double-submit CSRF token (M1-005): the value of the non-`HttpOnly`
        `bl_csrf` cookie, echoed back in this header.

        **Required in practice** on every state-changing request authenticated
        by the session cookie, even though it is declared optional here. The
        rule belongs to one middleware, which answers a missing or wrong token
        with `403` and `code: "forbidden"`; declaring the parameter required
        would make an *absent* header a `400` from the request validator and a
        *wrong* one a `403`, splitting one rule across two layers and two status
        codes for no gain to the caller.

        A request authenticated by a service token does not send this and is not
        subject to the check — CSRF is a property of cookies, which browsers
        attach on their own.
      schema:
        type: string

    # The two halves of the pagination convention. Every collection endpoint
    # references these rather than declaring its own, so `limit` means the same
    # thing everywhere and the generated clients share one page shape:
    # `{items: [...], nextCursor: string|null}`.
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque cursor taken verbatim from the `nextCursor` of a previous
        response. Absent means "from the beginning". Its contents are an
        implementation detail — clients must not parse or construct one.
      schema:
        type: string
        minLength: 1

    EngagementId:
      name: engagementId
      in: path
      required: true
      description: The engagement whose activity is being listed.
      schema:
        type: string
        format: uuid

    # The account a user-administration operation acts on. Declared once because
    # six operations name it, and because api/authz.go checks that the parameter
    # `x-authz-resource.param` points at is one the operation actually declares —
    # six copies would be six chances for that to be spelled differently.
    UserId:
      name: userId
      in: path
      required: true
      description: The account being read or changed.
      schema:
        type: string
        format: uuid


    ScenarioId:
      name: scenarioId
      in: path
      required: true
      description: The scenario being read or changed.
      schema:
        type: string
        format: uuid

    StepId:
      name: stepId
      in: path
      required: true
      description: The step being read or changed.
      schema:
        type: string
        format: uuid

    ExecutionId:
      name: executionId
      in: path
      required: true
      description: The execution being read or changed.
      schema:
        type: string
        format: uuid

    CommentId:
      name: commentId
      in: path
      required: true
      description: The comment being read or edited.
      schema:
        type: string
        format: uuid
    FindingId:
      name: findingId
      in: path
      required: true
      description: Finding surrogate id (UUIDv7).
      schema:
        type: string
        format: uuid
    UserStatusFilter:
      name: status
      in: query
      required: false
      description: Restrict the listing to accounts in this state.
      schema:
        $ref: "#/components/schemas/UserStatus"
    UserRoleFilter:
      name: role
      in: query
      required: false
      description: Restrict the listing to accounts holding this platform role.
      schema:
        $ref: "#/components/schemas/PlatformRole"
    UserSearch:
      name: q
      in: query
      required: false
      description: |
        Restrict the listing to accounts whose display name or email address
        contains this text, without regard to case. Not a prefix match: an
        administrator looking for somebody usually remembers a fragment rather
        than the beginning.
      schema:
        type: string
        minLength: 1
        maxLength: 320

    ActivityActor:
      name: actor
      in: query
      required: false
      description: Restrict to entries whose actor is this user id.
      schema:
        type: string
        format: uuid

    ActivityVerb:
      name: verb
      in: query
      required: false
      description: |
        Restrict to one verb, spelled `object.past_tense_verb` (for example
        `session.login` or `token.created`).
      schema:
        type: string
        minLength: 1
        maxLength: 100

    ActivityObjectType:
      name: objectType
      in: query
      required: false
      description: Restrict to entries whose object is of this type (for example `user` or `session`).
      schema:
        type: string
        minLength: 1
        maxLength: 100

    ActivityObjectId:
      name: objectId
      in: query
      required: false
      description: Restrict to entries whose object has this identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 200

    ContentSourceId:
      name: sourceId
      in: path
      required: true
      description: The content source identifier.
      schema:
        type: string
        format: uuid

    ContentSourceKindFilter:
      name: kind
      in: query
      required: false
      description: Restrict to one source kind.
      schema:
        $ref: "#/components/schemas/ContentSourceKind"

    ContentSourceEnabledFilter:
      name: enabled
      in: query
      required: false
      description: Restrict to enabled or disabled sources.
      schema:
        type: boolean

    ContentJobId:
      name: jobId
      in: path
      required: true
      description: Content sync job identifier (UUIDv7).
      schema:
        type: string
        format: uuid

    ContentJobStatusFilter:
      name: status
      in: query
      required: false
      description: Restrict to jobs in this lifecycle state.
      schema:
        $ref: "#/components/schemas/ContentSyncJobStatus"

    ContentJobSourceIdFilter:
      name: sourceId
      in: query
      required: false
      description: Restrict to jobs for this content source.
      schema:
        type: string
        format: uuid

    ContentVersionFilter:
      name: version
      in: query
      required: false
      description: |
        Restrict to one ATT&CK release label (for example `15.1`). Omit to
        return rows across every installed version of enabled sources.
      schema:
        type: string
        minLength: 1
        maxLength: 64

    ContentSearchQ:
      name: q
      in: query
      required: false
      description: |
        Case-insensitive substring match against `externalId`, `name`, and
        `description`.
      schema:
        type: string
        minLength: 1
        maxLength: 320

    ContentTacticFilter:
      name: tactic
      in: query
      required: false
      description: Restrict techniques to those linked to this tactic external id (for example `TA0002`).
      schema:
        type: string
        minLength: 1
        maxLength: 64

    ContentIsSubtechniqueFilter:
      name: isSubtechnique
      in: query
      required: false
      description: When set, restrict to sub-techniques (`true`) or top-level techniques (`false`).
      schema:
        type: boolean

    ContentLibraryLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return (default 500, max 2000).
      schema:
        type: integer
        minimum: 1
        maximum: 2000
        default: 500

    ContentTechniqueId:
      name: techniqueId
      in: path
      required: true
      description: Technique surrogate id (UUIDv7).
      schema:
        type: string
        format: uuid

    ContentTacticId:
      name: tacticId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ContentMitigationId:
      name: mitigationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ContentGroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ContentSoftwareId:
      name: softwareId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ContentProcedureTemplateId:
      name: templateId
      in: path
      required: true
      description: Procedure template surrogate id (UUIDv7).
      schema:
        type: string
        format: uuid

    ContentDetectionRuleId:
      name: ruleId
      in: path
      required: true
      description: Detection rule surrogate id (UUIDv7).
      schema:
        type: string
        format: uuid

    ContentEmulationPlanId:
      name: planId
      in: path
      required: true
      description: Emulation plan surrogate id (UUIDv7).
      schema:
        type: string
        format: uuid

    ContentNoteId:
      name: noteId
      in: path
      required: true
      description: Knowledge-base note surrogate id (UUIDv7).
      schema:
        type: string
        format: uuid

    EvidenceId:
      name: evidenceId
      in: path
      required: true
      description: Evidence surrogate id (UUIDv7).
      schema:
        type: string
        format: uuid


    ContentDetectionLevelFilter:
      name: level
      in: query
      required: false
      description: |
        Restrict to rules with this Sigma level label (for example `low`,
        `medium`, `high`, `critical`). Case-insensitive exact match.
      schema:
        type: string
        minLength: 1
        maxLength: 64


    ContentTechniqueExternalIdFilter:
      name: technique
      in: query
      required: false
      description: |
        Restrict to templates that list this ATT&CK technique external id
        (for example `T1059.001`). Exact membership match against the stored
        technique id list.
      schema:
        type: string
        minLength: 1
        maxLength: 64

    ContentPlatformFilter:
      name: platform
      in: query
      required: false
      description: |
        Restrict to templates that list this platform (for example `windows`,
        `linux`, `macos`). Case-insensitive exact membership match.
      schema:
        type: string
        minLength: 1
        maxLength: 64

    ContentLibrarySourceIdFilter:
      name: sourceId
      in: query
      required: false
      description: Restrict to templates from this content source.
      schema:
        type: string
        format: uuid

    ContentAttackVersionLabel:
      name: version
      in: path
      required: true
      description: |
        ATT&CK release label exactly as stored (for example `15.1`). Opaque
        text — no leading `v`, no semver rewriting. Surrounding whitespace is
        trimmed once; internal whitespace is rejected.
      schema:
        type: string
        minLength: 1
        maxLength: 64

    ContentAttackExternalId:
      name: externalId
      in: path
      required: true
      description: MITRE technique id (`T1059`, `T1059.001`).
      schema:
        type: string
        minLength: 1
        maxLength: 64



  responses:
    # One reusable response per problem code, so an operation cannot invent its
    # own error shape and the code/status pairing stays 1:1 with the table in
    # internal/httpapi/apierr (M0B-007).
    BadRequest:
      description: The request does not match this specification. `code` is `validation_failed`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: |
        No usable session — absent, expired, idle for too long, revoked, or the
        credentials just presented were wrong. `code` is `unauthenticated`.

        The client's move is to sign in. Compare `forbidden`, which means the
        caller is known and still may not do this.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated, but not permitted to do this. `code` is `forbidden`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MFAEnrolmentRequired:
      description: |
        A second factor is required of this caller and they hold none, so their
        session may do nothing but enrol one. `code` is `mfa_enrolment_required`
        (M1-008).

        It refines `forbidden` and shares its 403: a client that does not know
        this code should treat it as one. A client that does knows exactly what
        to render — the enrolment screen, with no way past it — and knows the
        way out is `POST /auth/mfa/totp/enroll` followed by
        `POST /auth/mfa/totp/confirm`, after which the session is rotated and
        fully privileged without signing in again.

        No operation lists this response, and none can: it is produced before a
        request reaches its operation, by the gate that stands in front of all of
        them, and every authenticated operation can answer with it. It is
        declared here so the code has a documented shape — the same reason
        `MethodNotAllowed` is.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: |
        No such resource — or one the caller may not know exists, which is
        reported the same way on purpose. `code` is `not_found`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MethodNotAllowed:
      description: |
        The path exists but not with this method. `code` is `method_not_allowed`.

        No operation references this response, and none can: a 405 is decided
        before a request matches an operation, by the request validator that
        looked the path up in this document (M0B-006). It is declared here
        anyway so that every problem code has a response describing its shape —
        the pairing TestEveryProblemCodeHasASharedResponse checks.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request contradicts the current state of the resource. `code` is `conflict`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: |
        Rate limited. `code` is `rate_limited`.

        `Retry-After` says how many seconds to wait, and is always present.
        Retrying before it elapses does not shorten it.
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: The request body exceeds the configured size limit. `code` is `payload_too_large`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: |
        Something failed that the caller cannot act on. `code` is `internal` and
        `detail` is deliberately generic — the cause is in the server log under
        the request ID echoed in `instance`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: |
        RFC 9457 problem detail — the only error shape this API produces, served
        as `application/problem+json` (M0B-007).

        Clients switch on `code`. `title` and `detail` are prose for a human and
        may be reworded at any time.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri-reference
          description: |
            URI reference identifying the problem type. `about:blank` when the
            status code says everything there is to say.
          examples:
            - about:blank
        title:
          type: string
          description: Short human-readable summary of the problem type. Stable for a given `type`.
          examples:
            - Not Found
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: The HTTP status code, repeated so a logged or forwarded body stands alone.
          examples:
            - 404
        detail:
          type: string
          description: |
            Explanation specific to this occurrence. Never carries internal
            detail: an unrecognised server-side error is reported generically and
            the real error goes to the log.
        instance:
          type: string
          description: |
            The request ID, echoed as `X-Request-Id`. A user quotes it in a bug
            report and an operator greps for it.

            RFC 9457 types this as a URI reference; a bare request ID is a
            relative reference, and it is far more useful to a support desk than
            a URI that resolves to nothing.
          examples:
            - 018f3b2c-7a41-7c3e-9b0d-2f1a4c6e8d90
        code:
          $ref: "#/components/schemas/ProblemCode"
        errors:
          type: array
          description: Field-level failures. Present when `code` is `validation_failed`.
          items:
            $ref: "#/components/schemas/FieldError"

    ProblemCode:
      type: string
      description: |
        Stable machine-readable error identifier. Clients switch on this, never on
        `detail` and never on the status alone.

        Each code maps to exactly one HTTP status; the mapping lives in
        internal/httpapi/apierr and a test there asserts it (M0B-007). Adding a
        code means adding it in both places in the same change.

        The reverse is *nearly* 1:1. A code may refine another — same status,
        more specific instruction — and `mfa_enrolment_required` is the one that
        does, refining `forbidden`. A client that does not know a refinement can
        always fall back to the code it refines, and internal/httpapi/apierr
        holds the refinement table that says which that is.
      enum:
        - validation_failed
        - unauthenticated
        - forbidden
        - mfa_enrolment_required
        - not_found
        - method_not_allowed
        - conflict
        - rate_limited
        - payload_too_large
        - internal

    FieldError:
      type: object
      description: One field-level validation failure.
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Path of the offending field within the request body.
          examples:
            - members[0].role
        message:
          type: string
          description: What is wrong with it, in English.
          examples:
            - must be one of lead, red, blue, observer

    Health:
      type: object
      description: |
        Health of the server and of everything it depends on. Reported with a 200
        when `status` is `ok` and a 503 when it is `error`, so a monitor that only
        looks at the status code still gets the right answer.
      required:
        - status
        - checks
      properties:
        status:
          $ref: "#/components/schemas/HealthState"
        checks:
          $ref: "#/components/schemas/HealthChecks"

    HealthChecks:
      type: object
      description: |
        One entry per dependency. Adding a dependency means adding its check
        here — a check that exists in code but not in this schema is invisible to
        every client.
      required:
        - db
      properties:
        db:
          $ref: "#/components/schemas/HealthState"

    HealthState:
      type: string
      description: Outcome of a single health check, or of the report as a whole.
      enum:
        - ok
        - error

    Version:
      type: object
      description: |
        Build identity of the running binary, stamped at link time. Every field is
        populated: an unstamped build reports a placeholder rather than an empty
        string.
      required:
        - version
        - commit
        - buildDate
      properties:
        version:
          type: string
          description: Release identifier from `git describe`, or `dev` for an unstamped build.
          examples:
            - v2.1.0-3-gabc1234
        commit:
          type: string
          description: Git commit the binary was built from, or `unknown`.
          examples:
            - a1b2c3d4e5f6
        buildDate:
          type: string
          description: |
            UTC build timestamp, RFC 3339 — or the literal `unknown` for a build
            without version stamping. Deliberately not `format: date-time`,
            because it is not always a timestamp and a client must not assume it
            parses.
          examples:
            - 2026-02-01T12:00:00Z

    LoginRequest:
      type: object
      description: Credentials for `POST /auth/login`.
      required:
        - email
        - password
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 320
          description: |
            The address the account was created with, matched without regard to
            case or surrounding whitespace.
          examples:
            - alice@example.com
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: |
            The password, as typed. The bounds here are a backstop on an
            unauthenticated path, not the policy: the policy lives in one place
            (internal/authn/password) and applies where a password is *set*.
            Holding a login attempt to it would tell an attacker how long the
            password is not.

    LoginStatus:
      type: string
      description: |
        What a successful `POST /auth/login` established. A client must branch on
        this rather than assume that 200 means signed in.
      enum:
        # Credentials accepted and a session issued; the cookie is set.
        - authenticated
        # Credentials accepted, but a second factor is required and has not been
        # presented. No session, no cookie (M1-006).
        - mfa_required
        # Credentials accepted, a second factor is required, and this person has
        # none to present. A session cookie *is* set, and it may do exactly one
        # thing: enrol an authenticator (M1-008).
        - mfa_enrolment_required

    LoginResult:
      type: object
      description: The outcome of a successful `POST /auth/login`.
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/LoginStatus"
        user:
          $ref: "#/components/schemas/CurrentUser"
          description: |
            The signed-in user. Present when `status` is `authenticated` or
            `mfa_enrolment_required` — both of those issued a session, and the
            second one needs `mfa` to render the enrolment screen it is confined
            to.

            Absent when `status` is `mfa_required`: a caller awaiting a second
            factor has no session and has not been told who they are yet.

    AuthProviders:
      type: object
      description: |
        What the login page may offer. It is deliberately a list rather than a
        set of booleans: SAML sits beside OIDC in it (M1-010), and a page that
        renders this array needed no change when it arrived.
      required:
        - password
        - sso
      properties:
        password:
          type: boolean
          description: |
            Whether local email-and-password sign-in is offered. Always true
            today; it is stated rather than assumed so that a deployment which
            later turns it off has somewhere to say so.
        sso:
          type: array
          description: |
            Every single sign-on provider that is configured **and** reachable
            right now. A configured provider that cannot be discovered is absent
            rather than listed-and-broken.
          items:
            $ref: "#/components/schemas/SSOProvider"

    SSOProvider:
      type: object
      description: One single sign-on button.
      required:
        - id
        - label
        - startUrl
      properties:
        id:
          type: string
          description: Which protocol this provider speaks.
          enum:
            - oidc
            - saml
        label:
          type: string
          description: |
            What to write on the button. It names the protocol rather than the
            provider: the issuer URL is configuration, and putting it on a public
            page would tell an unauthenticated caller which directory this
            organization uses.
        startUrl:
          type: string
          description: |
            Where to send the browser to begin. A path within this deployment,
            relative to the API base — navigate to it, do not fetch it.

    CurrentUser:
      type: object
      description: |
        The caller, as `GET /auth/me` reports them. It carries nothing about the
        session token: the cookie is the only place that value exists outside the
        client.
      required:
        - id
        - email
        - displayName
        - platformRole
        - mfa
        - memberships
      properties:
        id:
          type: string
          description: The user's identifier — a UUIDv7, as every identifier here is.
        email:
          type: string
          description: The address as it was typed when the account was created.
        displayName:
          type: string
          description: The name to show for this person.
        platformRole:
          $ref: "#/components/schemas/PlatformRole"
        mfa:
          $ref: "#/components/schemas/MFAState"
        memberships:
          type: array
          description: |
            Every engagement this person belongs to, and their role in it. An
            administrator's list is still only what they are a *member* of —
            their reach beyond it comes from `platformRole`, not from here.
          items:
            $ref: "#/components/schemas/EngagementMembership"
        csrfToken:
          type: string
          description: |
            The double-submit CSRF token for this session (M1-005) — the same
            value as the `bl_csrf` cookie, which is where a browser client
            should read it from.

            It is here for a client that has no cookie jar to read, and it is
            not a secret in the way the session token is: it authorizes nothing
            on its own. Absent for a caller authenticated by a service token,
            which is not subject to the check.

    PlatformRole:
      type: string
      description: |
        What somebody may do to this installation: `admin` manages users, content
        and every engagement; `member` takes part in the engagements they belong
        to. What they may do *inside* one is `EngagementRole`, and the two are
        deliberately not the same vocabulary.
      enum:
        - admin
        - member

    EngagementRole:
      type: string
      description: |
        What somebody may do inside one engagement. Red and blue are separate so
        that blind mode and the split write endpoints have something to decide
        on.
      enum:
        - lead
        - red
        - blue
        - observer

    EngagementMembership:
      type: object
      description: One person's place in one engagement.
      required:
        - engagementId
        - role
        - addedAt
      properties:
        engagementId:
          type: string
        role:
          $ref: "#/components/schemas/EngagementRole"
        addedAt:
          type: string
          format: date-time

    EngagementMember:
      type: object
      description: One person seated in one engagement, with user display fields.
      required:
        - id
        - email
        - displayName
        - role
        - addedAt
      properties:
        id:
          type: string
          description: The user's identifier.
        email:
          type: string
          description: Their email address.
        displayName:
          type: string
          description: The name to show for this person.
        role:
          $ref: "#/components/schemas/EngagementRole"
        addedAt:
          type: string
          format: date-time

    AddMember:
      type: object
      description: Request to seat a user in an engagement.
      required:
        - userId
        - role
      properties:
        userId:
          type: string
          description: The user to add.
        role:
          $ref: "#/components/schemas/EngagementRole"

    PatchMember:
      type: object
      description: Change a member's engagement role.
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/EngagementRole"

    UserStatus:
      type: string
      description: |
        Whether an account can be used. Retirement is a status change and never
        a deletion: the executions, comments and findings somebody wrote keep
        their author (`M1-001`).
      enum:
        # Created and never claimed. It cannot sign in with a password — it has
        # none — and the first single sign-on that resolves to its address
        # claims it and makes it `active`.
        - invited
        - active
        # Retired, or suspended. Every session is revoked and every service
        # token the account owns stops working, because a token spends its
        # owner's permissions and an account in this state has none.
        - disabled

    User:
      type: object
      description: |
        One account, as user administration reports it. Compare `CurrentUser`,
        which is the caller describing themselves and carries their memberships
        and their MFA state; this is an administrator describing somebody else.

        What is *not* here is the point of it: there is no password hash, no
        authenticator secret, no recovery code and no session token, so no
        response built from this schema can carry one.
      required:
        - id
        - email
        - displayName
        - platformRole
        - status
        - mfaEnforced
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          description: The address as it was typed. Matched without regard to case everywhere it is looked up.
          examples:
            - alice@example.com
        displayName:
          type: string
        platformRole:
          $ref: "#/components/schemas/PlatformRole"
        status:
          $ref: "#/components/schemas/UserStatus"
        mfaEnforced:
          type: boolean
          description: |
            Whether an administrator requires a second factor of this person
            specifically. It is one input to the effective requirement and not
            the whole answer — see `MFAState.required`, which is what an
            interface acts on for the *signed-in* user.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          description: When this account last signed in. Absent if it never has.

    UserPage:
      type: object
      description: |
        One page of accounts, oldest first — identifiers are UUIDv7, so that is
        creation order and a stable total order at the same time. `nextCursor`
        is taken verbatim from a previous response; absent (or null) means there
        is no further page.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        nextCursor:
          type: [string, "null"]
          minLength: 1
          description: Opaque cursor for the next page. Pass it back as `cursor`.

    CreateUserRequest:
      type: object
      description: |
        Body of `POST /users`. The identifier, the timestamps and the invite
        link are the server's; everything a caller chooses is here.
      required:
        - email
        - displayName
        - platformRole
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
          description: |
            The address, stored as typed and compared without regard to case or
            surrounding whitespace. An address another account already holds is
            `409`.
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        platformRole:
          $ref: "#/components/schemas/PlatformRole"
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: |
            A password for a local account. Omit it for an account that signs in
            through the identity provider.

            The bounds here are a backstop, not the policy: the policy lives in
            one place (internal/authn/password) and is reported as field errors
            on `password`, so there is one definition of an acceptable password
            rather than one here and one in the client.
        status:
          description: |
            The state to create the account in. Omitted, it is derived from
            `password`: `active` with one, `invited` without.

            `disabled` is not offered — creating an account that cannot be used
            is a way of describing an account that should not have been created.
            An `invited` account with a password is refused with a field error:
            an invited account has no local sign-in, so the password would be
            one nobody could ever use.
          type: string
          enum:
            - invited
            - active
        mfaEnforced:
          type: boolean
          description: Require a second factor of this person specifically. Defaults to false.

    CreatedUser:
      type: object
      description: |
        A newly created account and where to send the person it belongs to.
      required:
        - user
        - inviteUrl
      properties:
        user:
          $ref: "#/components/schemas/User"
        inviteUrl:
          type: string
          description: |
            Where this installation is signed in to. There is no mail transport
            in this deployment, so nothing was sent: an administrator passes
            this on themselves, with the password they chose or with a note to
            use the single sign-on button.

            It carries no credential and grants nothing — it is a link to the
            front door, and anybody may already know it.
          examples:
            - https://blacklight.example.com/login

    UpdateUserRequest:
      type: object
      description: |
        Body of `PATCH /users/{userId}`. Every field is optional and an absent
        one is left alone, so two administrators editing different things do not
        overwrite each other. At least one must be present — an empty patch is a
        client bug, and answering it `200` would hide one.

        `email` is deliberately not a field: it is what a federated sign-in
        links an account by, so editing it could move somebody else's single
        sign-on onto this account.
      minProperties: 1
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        platformRole:
          $ref: "#/components/schemas/PlatformRole"
        status:
          $ref: "#/components/schemas/UserStatus"
        mfaEnforced:
          type: boolean

    UpdateSelfRequest:
      type: object
      description: |
        Body of `PATCH /users/me`. One field, and that is the design: a schema
        with no `platformRole` in it is a request that cannot ask for one, which
        is a stronger guarantee than a handler that declines to honour it
        (PLAN.md §4).
      required:
        - displayName
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200

    RevokedSessions:
      type: object
      description: |
        What `POST /users/{userId}/sessions/revoke` or
        `POST /auth/sessions/revoke-others` ended.
      required:
        - revoked
      properties:
        revoked:
          type: integer
          minimum: 0
          description: |
            How many live sessions were ended. Zero is a normal answer: the
            account may have had none, or somebody may have revoked them a
            moment ago.

    Session:
      type: object
      description: |
        One browser this account is signed in on, as `GET /auth/sessions`
        reports it.

        Everything here is what the server observed when the session was issued
        and last used. Nothing in it identifies the token: the value in the
        cookie is not stored — only a hash of it is — so there is no field to
        leave out by mistake.
      required:
        - id
        - current
        - createdAt
        - lastSeenAt
        - expiresAt
        - mfaSatisfied
      properties:
        id:
          type: string
          format: uuid
          description: The session's identifier, and what `DELETE /auth/sessions/{sessionId}` takes.
        current:
          type: boolean
          description: |
            Whether this is the session the request was made on. Exactly one row
            in a response has it, and it is the row a client marks as "this
            device" rather than offering to revoke.
        createdAt:
          type: string
          format: date-time
          description: When this session was issued — the sign-in it belongs to.
        lastSeenAt:
          type: string
          format: date-time
          description: |
            When a request last arrived on it, to within a minute: recording
            every request would put a write in front of every read, so it is
            written back at most once a minute (`internal/authn/session`).
        expiresAt:
          type: string
          format: date-time
          description: |
            The absolute expiry. Nothing extends it, so a session ends at this
            moment however busy it has been. It may end sooner by going idle,
            which is a policy this document does not carry — a client that
            wanted to render "expires in" should say "expires by".
        mfaSatisfied:
          type: boolean
          description: |
            Whether a second factor was presented for *this* session, as
            opposed to at some point in this account's past (M1-006). A
            deployment that has just turned the requirement on can have live
            sessions where this is false.
        ip:
          type: string
          description: |
            The client address the session was issued to, as the server saw it
            (`internal/httpapi.clientIP`). Absent when the request did not carry
            one. It is what somebody scans the list for, and it is the server's
            observation rather than anything the client claimed.
        userAgent:
          type: string
          description: |
            The `User-Agent` the session was issued to, absent when the request
            sent none. Attacker-controlled, like every request header: render it
            as text and never as markup.

    Sessions:
      type: object
      description: |
        Your live sessions. Unpaginated, like `GET /auth/tokens` and for the
        same reason: this is one person's own credentials, the count is small
        and bounded by how many browsers they sign in from, and a page boundary
        in the middle of "where am I signed in" would be a list somebody could
        act on half of.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"

    MFAState:
      type: object
      description: |
        Where this person and this session stand on multi-factor authentication.
        Whether an administrator *requires* it and whether this session has
        *satisfied* it are separate facts — conflating them is the hole M1-008
        closes.
      required:
        - enforced
        - required
        - enrolled
        - satisfied
        - recoveryCodesRemaining
      properties:
        enforced:
          type: boolean
          description: |
            An administrator requires a second factor of *this person
            specifically* — the per-user flag, set through the user
            administration API.

            It is one of the inputs to `required`, and not the whole answer:
            somebody can be required to hold a factor by the platform policy
            with this flag off. A client deciding whether to block should read
            `required`.
        required:
          type: boolean
          description: |
            Whether this person must hold a second factor: `enforced`, or the
            platform policy (`GET /settings/mfa`) applying to them. This is the
            effective answer and the one an interface acts on (M1-008).

            `required` with `enrolled` false is the state that confines a
            session to enrolling: every other endpoint answers `403` with `code`
            `mfa_enrolment_required` until an enrolment is confirmed.

            An account that signs in only through an identity provider is
            exempt, and reports `false` — the provider owns its factors. See
            `docs/security.md`.
        enrolled:
          type: boolean
          description: |
            This person has a confirmed authenticator (M1-006). A *started* but
            unconfirmed enrolment does not count — it gates nothing, so
            reporting it as enrolled would be a lie the interface acted on.

            Separate from `enforced` for the same reason `satisfied` is:
            "required to" and "has" are different facts, and treating one as
            evidence of the other is the hole M1-008 closes.
        satisfied:
          type: boolean
          description: A second factor was presented for *this* session.
        recoveryCodesRemaining:
          type: integer
          minimum: 0
          description: |
            How many unused recovery codes this person holds (M1-007). `0` for
            somebody who has not enrolled: codes are minted when an enrolment is
            confirmed and deleted when it is removed.

            A count and never the codes — those were shown once, and the server
            keeps only their hashes. Warn below three: the number matters most
            to the person who is one lost phone away from having no way in.

    MFAPolicy:
      type: object
      description: |
        The platform-wide half of the multi-factor requirement (M1-008). The
        other half is the per-user `mfaEnforced` flag, and the effective
        requirement for one person is the **or** of whichever apply — so turning
        both of these off does not release somebody an administrator has
        individually enforced.

        Policy is evaluated before enrolment is looked at, which is the whole
        point: v1 asked "have they enrolled?" and so let anybody who skipped
        enrolment sign in with a password alone.
      required:
        - requiredForAll
        - requiredForAdmins
      additionalProperties: false
      properties:
        requiredForAll:
          type: boolean
          description: Every account that signs in with a local password must hold a second factor.
        requiredForAdmins:
          type: boolean
          description: |
            Every account with the `admin` platform role must hold one. Implied
            by `requiredForAll`; the two are stored separately so that turning
            the wider one off does not silently release administrators too.

    ChangePasswordRequest:
      type: object
      description: |
        Body of `POST /auth/password`. The current password is required even
        though the caller is signed in: a session left open on a shared machine
        must not be enough to take the account over.
      required:
        - currentPassword
        - newPassword
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
        newPassword:
          type: string
          minLength: 1
          maxLength: 1024
          description: |
            The replacement. The policy — at least 12 characters, at most 128,
            and not one of the passwords attackers try first — is applied by the
            server and reported as field errors on `newPassword`, so that there
            is one definition of an acceptable password rather than one here and
            one in the client.

    TOTPEnrolment:
      type: object
      description: |
        A newly minted, unconfirmed authenticator secret, in the three forms a
        person might need to get it into an app. Every field carries the same
        secret; this is the only response in the API that does.
      required:
        - otpauthUri
        - secret
        - qrCode
      properties:
        otpauthUri:
          type: string
          description: |
            The `otpauth://totp/...` URI, for a client that can hand a URI to an
            authenticator directly.
          examples:
            - otpauth://totp/Blacklight%20%28blacklight.internal%29:alice@example.com?algorithm=SHA1&digits=6&issuer=Blacklight+%28blacklight.internal%29&period=30&secret=JBSWY3DPEHPK3PXP
        secret:
          type: string
          description: |
            The base32 shared secret, for typing in by hand. It is the same
            value that is inside `otpauthUri`, spelled out so a client does not
            have to parse one to show the other.
          examples:
            - JBSWY3DPEHPK3PXP
        qrCode:
          type: string
          description: |
            The URI rendered as a PNG in a `data:` URI, ready to be the `src` of
            an `<img>`. A data URI rather than SVG markup so that showing it
            does not mean putting server-supplied markup into the page; the
            content security policy already allows `img-src data:`.
          examples:
            - data:image/png;base64,iVBORw0KGgoAAAANSUhEUg…

    TOTPCodeRequest:
      type: object
      description: |
        A six-digit code from an authenticator app. The same body confirms an
        enrolment and completes a sign-in.
      required:
        - code
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
          description: |
            The code as the app shows it, without the space some apps put in the
            middle. Six digits is the whole vocabulary — a value that is not six
            digits is rejected as malformed rather than counted as a guess.
          examples:
            - "492817"

    DisableTOTPRequest:
      type: object
      description: |
        Body of `DELETE /auth/mfa/totp`. The current password is required for the
        same reason `ChangePasswordRequest` asks for it.
      required:
        - currentPassword
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024

    RecoveryCodes:
      type: object
      description: |
        A freshly minted set of recovery codes (M1-007), in the only response
        that ever carries them. Put them in front of the person immediately and
        offer a way to save or print them: there is no endpoint that reads them
        back, because the server stores only their hashes.
      required:
        - codes
        - generatedAt
      properties:
        codes:
          type: array
          minItems: 1
          description: |
            Ten single-use codes, each twenty characters of Crockford base32 —
            the digits and the uppercase letters, less `I`, `L`, `O` and `U`, so
            that no two characters in a code look alike. That is 100 bits each.

            They arrive grouped in fours for transcription. The grouping is
            presentation: the server accepts them back in any case, with or
            without the hyphens, and folds the four omitted characters onto
            what they resemble (`O`→`0`, `I`/`L`→`1`) so that somebody's
            handwriting cannot lock them out.
          items:
            type: string
            examples:
              - 3K9M-2PTV-XA47-QRJH-58WY
        generatedAt:
          type: string
          format: date-time
          description: |
            When this set was minted. It is what an interface shows next to
            "you last replaced these on …", and the moment every previous code
            stopped working.

    RecoveryCodeRequest:
      type: object
      description: |
        Body of `POST /auth/mfa/recovery/verify`: one recovery code, as the
        person has it written down.
      required:
        - code
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 20
          maxLength: 32
          pattern: "^[0-9A-Za-z -]+$"
          description: |
            The code, in any case, with or without the hyphens it was printed
            with. The bounds and the pattern here are a backstop that keeps
            obvious junk off an unauthenticated path — what a code actually is
            gets decided in one place, `internal/authn/recovery.Parse`, and
            anything that gets past this and fails there is refused as an
            incorrect code rather than as a malformed request. Two answers to
            one question is how the two definitions would drift apart.
          examples:
            - 3K9M-2PTV-XA47-QRJH-58WY

    TokenScope:
      type: string
      description: |
        One coarse permission a service token may carry (M1-011). Scopes are few
        and blunt deliberately: a scope per endpoint would be a second
        permission model to keep in step with the real one, and the real one is
        `docs/authz.md`.

        A scope is never a grant on its own. Holding `admin:write` permits
        nothing the token's owner could not already do — see
        `POST /auth/tokens`. These words are the ones `internal/authz` requires
        of each action, and `TestTheTokenScopeEnumMatchesTheOnePlaceScopesAreDefined`
        fails the build if this list and that one disagree.
      enum:
        - admin:read
        - admin:write
        - content:read
        - content:sync
        - content:write
        - engagements:read
        - engagements:write
        - reports:read
        - reports:write

    ServiceToken:
      type: object
      description: |
        One service token, as anybody but its creator ever sees it: everything
        about the credential except the credential.
      required:
        - id
        - name
        - prefix
        - scopes
        - createdAt
        - expiresAt
        - status
      properties:
        id:
          type: string
          format: uuid
          description: The token's identifier, and what `DELETE /auth/tokens/{tokenId}` names. Not a credential.
        name:
          type: string
          description: What its owner called it, so they can tell which one to revoke.
          examples:
            - nightly coverage export
        prefix:
          type: string
          description: |
            The public identifier in the middle of the token — the `xxx` of
            `bl_xxx_…`. It is how a token found in a log or a CI variable is
            matched to a row here without anybody handling its secret.
          examples:
            - K7QM4TZB2A
        scopes:
          type: array
          minItems: 1
          description: What this token may do, subject to what its owner may do.
          items:
            $ref: "#/components/schemas/TokenScope"
        engagementId:
          type: string
          format: uuid
          description: |
            The one engagement this token may touch. Absent on a token that may
            reach every engagement its owner can. It only ever subtracts.
        status:
          $ref: "#/components/schemas/ServiceTokenStatus"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: When it stops working. Always set — a token with no expiry cannot be created.
        lastUsedAt:
          type: string
          format: date-time
          description: |
            When it was last used. Absent if it never has been. Accurate to
            within a minute and deliberately no more: recording every request
            would put a database write behind every request, and this column
            answers "is this still in use?", which does not need the seconds.
        revokedAt:
          type: string
          format: date-time
          description: |
            When somebody ended it early. Absent on a token nobody has revoked;
            expired and revoked are different facts and `status` says which.
        revokedBy:
          type: string
          format: uuid
          description: |
            Which account ended it. Absent on a token nobody has revoked, and
            equal to the owner on one its owner rotated themselves — so a value
            here that is *not* the owner is an administrator having stepped in
            (`DELETE /users/{userId}/tokens/{tokenId}`), which is the question
            an incident review asks of the credential in front of it.

    ServiceTokenStatus:
      type: string
      description: |
        Whether a token works right now, derived from its timestamps so that a
        client does not have to compare dates to render a list. `revoked` wins
        over `expired` where both are true: it is the fact somebody acted on.
      enum:
        - active
        - expired
        - revoked

    ServiceTokens:
      type: object
      description: |
        A set of service tokens, newest first. Both listings return it — your
        own (`GET /auth/tokens`) and, for an administrator, one account's
        (`GET /users/{userId}/tokens`) — so the two cannot come to describe a
        token differently.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceToken"

    CreatedServiceToken:
      type: object
      description: |
        A token that has just been created: the row, plus the one and only copy
        of its secret. Nothing else in this API ever carries `token`.
      required:
        - serviceToken
        - token
      properties:
        serviceToken:
          $ref: "#/components/schemas/ServiceToken"
        token:
          type: string
          description: |
            The credential, spelled `bl_<prefix>_<secret>`. Send it as
            `Authorization: Bearer <token>`.

            Show it to the person immediately and offer a way to copy it. There
            is no endpoint that reads it back, because the server keeps only a
            hash of it — a lost token is replaced, never recovered.
          examples:
            - bl_K7QM4TZB2A_2VHQ5XKPYD3JW8N6RTFA9CBEM4SZUG7LH2QX3KVD5RY

    CreateServiceTokenRequest:
      type: object
      description: Body of `POST /auth/tokens`. The owner is the caller and is not a field.
      required:
        - name
        - scopes
        - expiresAt
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: How you will recognise this token when you come to revoke it.
        scopes:
          type: array
          minItems: 1
          description: |
            What the token may do. Repeats are accepted and stored once; a scope
            this server does not define is a `400` rather than a silently
            narrower token.
          items:
            $ref: "#/components/schemas/TokenScope"
        engagementId:
          type: string
          format: uuid
          description: |
            Bind the token to one engagement. Omit for a token that may reach
            every engagement you can. It cannot widen what you may reach.
        expiresAt:
          type: string
          format: date-time
          description: |
            When the token should stop working. Required, must be in the future,
            and at most one year out — `400` otherwise, naming the field.

    RegenerateRecoveryCodesRequest:
      type: object
      description: |
        Body of `POST /auth/mfa/recovery/regenerate`. The current password is
        required for the same reason `ChangePasswordRequest` asks for it; the
        second factor is not in the body, it is the requirement that this
        session has already satisfied one.
      required:
        - currentPassword
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024

    ActivityEntry:
      type: object
      description: |
        One row of the append-only activity log (M1-015). Drives the SSE feed
        (M4) and the report timeline (M6). There is no update or delete.
      required:
        - id
        - verb
        - objectType
        - objectId
        - at
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7. Sortable by creation; the stable tiebreaker when two rows share a timestamp.
        engagementId:
          type: string
          format: uuid
          description: |
            The engagement this entry belongs to. Absent on platform events
            (logins, token lifecycle, role changes).
        actorId:
          type: string
          format: uuid
          description: |
            Who did it. Absent when the actor is unknown — a failed login that
            named no account.
        verb:
          type: string
          description: |
            What happened, spelled `object.past_tense_verb`. Examples:
            `session.login`, `session.login_failed`, `token.created`,
            `mfa.enrolled`.
          examples:
            - session.login
        objectType:
          type: string
          description: The kind of thing acted on (`user`, `session`, `service_token`, …).
          examples:
            - session
        objectId:
          type: string
          description: The identifier of the thing acted on.
        delta:
          type: object
          additionalProperties: true
          description: |
            Before/after for changed fields, already redacted. Never a password
            hash, token secret, TOTP secret, session token or recovery code.
            Absent when there is nothing useful to say beyond the verb.
        at:
          type: string
          format: date-time
          description: When it happened, UTC.

    ActivityPage:
      type: object
      description: |
        One page of the activity log. `nextCursor` is taken verbatim from a
        previous response; absent (or null) means there is no further page.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEntry"
        nextCursor:
          type: [string, "null"]
          minLength: 1
          description: |
            Opaque cursor for the next page. Pass it back as `cursor`. Clients
            must not parse or construct one.

    ContentSourceKind:
      type: string
      description: |
        Closed vocabulary of content libraries. New kinds are a migration, not
        a string somebody passed to an API. There is no create-source endpoint
        in M2 — only the seeded rows.
      enum:
        - attack
        - atomic
        - sigma
        - ctid
        - custom

    ContentSourceStatus:
      type: string
      description: |
        Operational state of a source as a whole. Independent of `enabled`: a
        disabled source can still be idle, and an enabled one can be in error.
      enum:
        - idle
        - syncing
        - error

    ContentSourceVersionStatus:
      type: string
      description: State of one version snapshot under a source.
      enum:
        - pending
        - ready
        - error

    ContentSyncJobKind:
      type: string
      description: What a content sync job is doing.
      enum:
        - sync
        - reprocess
        - bundle_import
        - v1_import

    ContentSyncJobStatus:
      type: string
      description: Lifecycle state of a content sync job.
      enum:
        - queued
        - running
        - cancelling
        - cancelled
        - succeeded
        - failed
        - interrupted

    ContentSource:
      type: object
      description: |
        One content library registry row — an upstream source or the custom
        home for user-authored rows.
      required:
        - id
        - kind
        - name
        - url
        - ref
        - enabled
        - status
        - itemCount
        - error
        - licenseSpdx
        - licenseName
        - licenseUrl
        - attribution
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ContentSourceKind"
        name:
          type: string
          examples:
            - ATT&CK Enterprise
        url:
          type: string
          description: Default HTTPS archive / bundle base URL. Empty for custom.
        ref:
          type: string
          description: Adapter-specific ref pattern or branch/tag hint. Empty when unused.
        enabled:
          type: boolean
          description: |
            Soft switch. Disabled sources stay on disk; browse/search/pickers
            omit their objects and new references are refused.
        status:
          $ref: "#/components/schemas/ContentSourceStatus"
        lastSyncedAt:
          type: string
          format: date-time
          description: When this source last finished a successful sync. Absent if never.
        itemCount:
          type: integer
          format: int64
          minimum: 0
          description: Bookkeeping count of objects currently held for this source.
        error:
          type: string
          description: Last error message from a failed job. Empty when none.
        licenseSpdx:
          type: string
          description: SPDX license identifier.
        licenseName:
          type: string
        licenseUrl:
          type: string
        attribution:
          type: string
          description: Attribution text shown in UI detail and export headers.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ContentSourceList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentSource"

    ContentSyncJobSummary:
      type: object
      description: |
        The most recent job for a source, as detail surfaces it. Prefer
        `ContentSyncJob` when reading a job by id.
      required:
        - id
        - kind
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ContentSyncJobKind"
        status:
          $ref: "#/components/schemas/ContentSyncJobStatus"
        version:
          type: string
          description: Version token the job targeted, when one was named.
        phase:
          type: string
        message:
          type: string
        error:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time

    ContentSyncJob:
      type: object
      description: One content sync / reprocess / bundle / v1-import job.
      required:
        - id
        - sourceId
        - kind
        - status
        - phase
        - progressCurrent
        - progressTotal
        - message
        - error
        - createdBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        version:
          type: string
          description: Version token the job targeted or resolved, when known.
        kind:
          $ref: "#/components/schemas/ContentSyncJobKind"
        status:
          $ref: "#/components/schemas/ContentSyncJobStatus"
        phase:
          type: string
          description: |
            Current pipeline phase: `fetch`, `parse`, `normalize`, `apply`,
            `finalize`, or empty before the worker picks the job up.
        progressCurrent:
          type: integer
          format: int64
          minimum: 0
        progressTotal:
          type: integer
          format: int64
          minimum: 0
        message:
          type: string
        error:
          type: string
          description: Failure detail when status is `failed`. Empty otherwise.
        createdBy:
          type: string
          description: User id that enqueued the job. Empty for system/blctl.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time

    ContentSyncJobList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentSyncJob"

    StartContentSyncRequest:
      type: object
      description: |
        Optional pin for multi-version sources. Additional properties are
        rejected so a mistyped field cannot silently no-op.
      additionalProperties: false
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            ATT&CK release label (e.g. `15.1`). Omit for latest discoverable.
            Ignored by rolling sources.


    UploadContentBundleRequest:
      type: object
      description: |
        Multipart offline bundle upload. `file` is the release archive; optional
        `version` pins ATT&CK multi-version sources the same way sync does.
      required:
        - file
      additionalProperties: false
      properties:
        file:
          type: string
          format: binary
          description: |
            Release archive bytes (typically `.zip` or `.tar.gz`) matching the
            adapter's online fetch shape. Size is capped by
            `BLACKLIGHT_CONTENT_MAX_BYTES` (default 512 MiB).
        version:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            ATT&CK release label (e.g. `15.1`). Omit for latest discoverable /
            the version embedded in the archive. Ignored by rolling sources.

    ReprocessContentSourceRequest:
      type: object
      description: |
        Optional pin for which raw snapshot to reprocess. Additional properties
        are rejected so a mistyped field cannot silently no-op.
      additionalProperties: false
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            ATT&CK release label (e.g. `15.1`). Omit for rolling sources
            (`current`). Required for ATT&CK.


    ContentSourceDetail:
      allOf:
        - $ref: "#/components/schemas/ContentSource"
        - type: object
          properties:
            lastJob:
              $ref: "#/components/schemas/ContentSyncJobSummary"
              description: Most recent job for this source, when any exists.

    UpdateContentSourceRequest:
      type: object
      description: |
        A patch. Every field is optional; an absent field is left alone. `kind`
        is deliberately not here.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        url:
          type: string
          maxLength: 2000
        ref:
          type: string
          maxLength: 500

    ContentSourceVersion:
      type: object
      description: One version snapshot under a source.
      required:
        - id
        - sourceId
        - version
        - status
        - itemCount
        - error
        - rawSha256
        - rawPath
        - rawBytes
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        version:
          type: string
          description: |
            Release label for ATT&CK (e.g. `15.1`), or the rolling token
            `current` for Atomic / Sigma / CTID / custom.
          examples:
            - "15.1"
            - current
        status:
          $ref: "#/components/schemas/ContentSourceVersionStatus"
        itemCount:
          type: integer
          format: int64
          minimum: 0
        syncedAt:
          type: string
          format: date-time
          description: When this version last finished successfully. Absent if never.
        error:
          type: string
        rawSha256:
          type: string
          description: Hex SHA-256 of the last successful raw snapshot. Empty if none.
        rawPath:
          type: string
          description: Path of the raw snapshot relative to the content data root.
        rawBytes:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ContentSourceVersionList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentSourceVersion"

    ContentTechnique:
