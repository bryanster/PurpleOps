          type: array
          items:
            $ref: "#/components/schemas/ContentProcedureTemplate"

    ContentDetectionRule:
      type: object
      description: |
        One detection rule reference (Sigma or custom). Reference only —
        Blacklight never executes, deploys, or converts rules to product
        queries (`PLAN.md` §3).
      required:
        - id
        - sourceId
        - version
        - externalId
        - name
        - description
        - techniqueExternalIds
        - level
        - status
        - logsource
        - ruleYaml
        - createdAt
