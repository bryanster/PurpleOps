[project]
name = "purpleops"
version = "2.0.0"
description = "Open-source self-hosted purple team management platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "docxtpl>=0.20.2",
    "dotenv>=0.9.9",
    "flask>=3.1",
    "flask-mongoengine-3>=1.1.0",
    "flask-security>=5.7.1",
    "gitpython>=3.1.46",
    "openpyxl>=3.1.5",
    "passlib>=1.7.4",
    "pymongo>=4.16.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "F401", # unused imports (many re-exported via wildcard)
    "F403", # star imports
    "F405", # names from star imports
]

[tool.ruff.lint.isort]
known-first-party = ["model", "utils", "blueprints"]
