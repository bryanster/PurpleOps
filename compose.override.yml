# Development overrides — loaded automatically by Docker Compose alongside compose.yml.
#
# Development:  docker compose up
# Production:   docker compose -f compose.yml --profile prod up

services:
  mongodb:
    # Expose MongoDB port for local tools (Compass, mongosh, etc.)
    ports:
      - "27017:27017"

  purpleops-dev:
    build: .
    container_name: purpleops-dev
    # Flask dev server with auto-reload
    command: python purpleops.py
    ports:
      - "${PORT:-8888}:${PORT:-8888}"
    env_file:
      - ./.env
    environment:
      FLASK_DEBUG: "True"
    depends_on:
      mongodb:
        condition: service_healthy
    # Mount source for live reload; venv lives at /opt/venv (outside workdir) so it isn't shadowed
    volumes:
      - .:/usr/src/app
      - ./custom:/usr/src/app/custom
