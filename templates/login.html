{% extends "master.html" %}
{% block content %}

<style>
    main {
        max-width: 300px;
        margin: 0 auto;
        margin-top: 100px;
    }

    h1, #submit {
        text-align: center;
    }

    .form-check {
        margin-top: 10px;
    }

    .form-floating {
        margin-top: 10px;
    }
</style>
<main>
    {{ logo() }}
    {% if flash_messages %}
        {% for fm in flash_messages %}
        <div class="alert alert-{{ fm.Category }}" role="alert">
            {{ fm.Message }}
        </div>
        {% endfor %}
    {% endif %}
    <h1 class="h3 mb-3 fw-normal">Sign in</h1>
    <form action="/login" method="POST" name="login_user_form">
        <div class="form-floating">
            <input id="email" name="email" required type="email" value="" class="form-control" >
            <label for="email">Email Address</label>
        </div>
        <div class="form-floating">
            <input id="password" name="password" required type="password" value="" class="form-control" >
            <label for="password">Password</label>
        </div>
        <div class="form-check">
            <input id="remember" name="remember" type="checkbox" value="y" class="form-check-input" >
            <label for="remember" class="form-check-label" >Remember Me</label>
        </div>
        <input id="submit" name="submit" type="submit" value="Login" class="btn btn-primary w-100 " >
    </form>
</main>

{% endblock %}
