{% extends "master.html" %}
{% block content %}

<style>
    main {
        max-width: 400px;
        margin: 0 auto;
        margin-top: 100px;
        text-align: center;
    }

    .form-check {
        margin-top: 10px;
    }

    .form-floating {
        margin-bottom: 10px;
    }
</style>
<main class="form-mfa">
    {{ logo() }}

    {% if flash_messages %}
        {% for fm in flash_messages %}
        <div class="alert alert-{{ fm.Category }}" role="alert">
            {{ fm.Message }}
        </div>
        {% endfor %}
    {% endif %}

    <h1 class="h3 mb-3 fw-normal">Multi-Factor Authentication</h1>
    <form action="/mfa/verify" method="POST" name="two_factor_verify_code_form">
        {{ csrf_field|safe }}
        <div class="form-floating">
            <input id="code" name="code" placeholder="XXXXXX" type="text" value="" required class="form-control">
            <label for="code">Authentication Code</label>
        </div>
        <input id="submit" name="submit" type="submit" value="Submit Code" class="btn btn-primary w-100 " >
    </form>
</main>
{% endblock %}
