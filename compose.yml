# Blacklight, as one container.
#
#     docker compose up --build
#
# That works from a clean clone with no further setup: the image carries the
# database, the UI and Chromium, and the entrypoint generates the session secret
# and the encryption key on first boot if you have not supplied them. Nothing is
# fetched at runtime.
#
# For anything beyond a laptop, read docs/deploy.md first — at minimum you must
# set BLACKLIGHT_BASE_URL, BLACKLIGHT_SESSION_SECRET and BLACKLIGHT_ENCRYPTION_KEY.

name: blacklight

services:
  blacklight:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        # Overridable so a release build can stamp real values; the Makefile's
        # docker-build target passes what `git describe` says.
        VERSION: ${BLACKLIGHT_VERSION:-v1-dev}
        COMMIT: ${BLACKLIGHT_COMMIT:-unknown}
        BUILD_DATE: ${BLACKLIGHT_BUILD_DATE:-unknown}
    image: blacklight:local

    # Optional, and optional on purpose: `docker compose up` must work on a
    # clean clone, where .env does not exist. Copy .env.example to .env when you
    # want to configure anything.
    env_file:
      - path: .env
        required: false

    # Change the left-hand side to move the published port. BLACKLIGHT_BASE_URL
    # has to agree with whatever a browser types — OIDC redirect URIs and report
    # share links are built from it — so if you move this, set that too.
    ports:
      - "${BLACKLIGHT_HOST_PORT:-8080}:8080"

    # Everything that must survive the container. The DuckDB file, its WAL, any
    # generated keys and uploaded evidence all live here; the image
    # creates the directory owned by uid 10001, and Docker seeds a new named
    # volume with that ownership, so the non-root user can write to it.
    #
    # `docker compose down` keeps this volume. `docker compose down -v` deletes
    # it, and with it every engagement in the deployment.
    volumes:
      - blacklight-data:/var/lib/blacklight

    # Chromium's renderer processes use shared memory and the 64 MB default is
    # not enough; a starved renderer crashes mid-render (M6). Cheap insurance —
    # it is an upper bound, not an allocation.
    shm_size: 512mb

    # Chromium leaves zombie children behind when it is killed, and PID 1 in a
    # container reaps nothing by default. `init: true` inserts a real init.
    init: true

    restart: unless-stopped

    # No healthcheck: block. It is defined in the image (deploy/Dockerfile) so
    # that `docker run` and any other compose file get it too, and compose
    # inherits it from there. `docker compose ps` shows the state.

  # A Keycloak realm to develop single sign-on against — OpenID Connect (M1-009)
  # and SAML 2.0 (M1-010). Development only, and behind a profile so that
  # `docker compose up` never starts it:
  #
  #     docker compose --profile sso up keycloak
  #
  # It imports deploy/keycloak/blacklight-realm.json on every start, in dev mode,
  # with an in-memory database — so the realm is exactly what is in the file and
  # nothing survives a restart. That is what makes it reproducible; it is also
  # why it must never be deployed.
  #
  # The realm holds one client per protocol, two groups (blacklight-admins,
  # blacklight-users) and three users to sign in as. The credentials are in the
  # file, and docs/sso-oidc.md and docs/sso-saml.md have the environment to run
  # Blacklight against each.
  keycloak:
    profiles: [sso]
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      # The admin console, at http://localhost:8081/admin. Dev-only credentials
      # for a dev-only container; there is nothing here worth protecting.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # The issuer every token carries and every redirect uses. It has to be the
      # URL a *browser* types, because the browser and this server both compare
      # it — which is why this is localhost and not the container name.
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
    ports:
      - "${KEYCLOAK_HOST_PORT:-8081}:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # Keycloak 26 serves its health endpoints on the management port (9000)
      # and ships no curl, so this goes through the JVM's own client.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\nHost: localhost\\nConnection: close\\n\\n' >&3 && grep -q '\"status\": \"UP\"' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  blacklight-data:
