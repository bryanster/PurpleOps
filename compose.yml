version: "3.8"

services:
  mongodb:
    image: mongo:8.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  purpleops:
    build: .
    container_name: purpleops
    command: ./purpleops
    ports:
      - "8080:8888"
    env_file:
      - ./.env
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - purpleops_data:/usr/src/app/files
      - ./custom:/usr/src/app/custom
    profiles:
      - prod

volumes:
  mongodb_data:
  purpleops_data:
